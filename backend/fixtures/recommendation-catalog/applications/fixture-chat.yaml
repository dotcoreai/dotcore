applicationId: "fixture-chat"
displayName: "Fixture Chat"
description: "Chat fixture that prefers Apple."
version: "1.0.0"
useCases: ["USE_CASE_CHAT_ASSISTANT"]
preferredAccelerators: ["apple"]
graph:
  services:
    - serviceName: "web"
      artifact:
        nix:
          flake: "self"
          package: "apps.fixture-chat.docker"
          dockerImage: {}
        supportedPlatforms:
          - operatingSystem: "linux"
            architecture: "amd64"
          - operatingSystem: "linux"
            architecture: "arm64"
      ports:
        - portName: "http"
          portNumber: 8080
  primaryEndpoint:
    serviceName: "web"
    portName: "http"
    protocol: "APPLICATION_ENDPOINT_PROTOCOL_HTTP"
