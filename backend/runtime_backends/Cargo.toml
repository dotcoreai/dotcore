[package]
name = "dotcore-runtime-backends"
description = "Runtime backends over the contracts: Docker, native launcher-held processes and simulated on a declared machine, plus the backend registry."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.99"

[dependencies]
anyhow.workspace = true
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
dotcore-domain.workspace = true
dotcore-host-process.workspace = true
dotcore-launcher.workspace = true
dotcore-node-hardware.workspace = true
dotcore-proto.workspace = true
dotcore-runtime.workspace = true
futures-util.workspace = true
getrandom.workspace = true
humantime = "2.4.0"
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml_ng.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[features]
# Test-only controls and fixtures for the unit tests of crates above; never enabled by production builds.
test-support = [
    "dep:tempfile",
    "dotcore-domain/test-support",
    "dotcore-host-process/test-support",
    "dotcore-runtime/test-support",
]

[dev-dependencies]
bytes = "1.11.0"
dotcore-domain = { path = "../domain", features = ["test-support"] }
dotcore-runtime = { path = "../runtime", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
