[package]
name = "dotcore"
description = "Top backend crate: controllers, inference router, dispatch, logs, server and composition."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.88"

[dependencies]
anyhow.workspace = true
base64.workspace = true
dotcore-artifact.workspace = true
dotcore-catalog.workspace = true
dotcore-domain.workspace = true
dotcore-host-process.workspace = true
dotcore-proto.workspace = true
dotcore-launcher.workspace = true
dotcore-node-hardware.workspace = true
dotcore-observability.workspace = true
dotcore-runtime.workspace = true
dotcore-runtime-backends.workspace = true
dotcore-site.workspace = true
fs4.workspace = true
futures-util.workspace = true
getrandom = { workspace = true, features = ["std"] }
http = "1.4.0"
httpdate = "1.0.3"
humantime = "2.4.0"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
libc.workspace = true
prost.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
sysinfo.workspace = true
thiserror.workspace = true
time.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tonic.workspace = true
tonic-web = "0.14.6"
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors"] }
url = { workspace = true, features = ["serde"] }

[features]
# Test-only controls and the `testing` façade; never enabled by production builds.
test-support = [
    "dotcore-artifact/test-support",
    "dotcore-catalog/test-support",
    "dotcore-domain/test-support",
    "dotcore-host-process/test-support",
    "dotcore-observability/test-support",
    "dotcore-runtime/test-support",
    "dotcore-runtime-backends/test-support",
    "dotcore-site/test-support",
]

[dev-dependencies]
rcgen = { workspace = true, features = ["x509-parser"] }
x509-parser.workspace = true
dotcore = { path = ".", features = ["test-support"] }
dotcore-nvml = { path = "../nvml" }
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
async-openai = { version = "0.42.2", default-features = false, features = ["chat-completion", "model"] }
tempfile.workspace = true
bytes = "1.11.0"
http-body = "1.0.1"
tokio = { workspace = true, features = ["test-util"] }
tonic-prost.workspace = true
