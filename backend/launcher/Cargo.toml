[package]
name = "dotcore-launcher"
description = "Per-workload process holder that outlives the backend, and the supervisor client that creates, stops and reads it."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.88"

[dependencies]
anyhow.workspace = true
dotcore-host-process.workspace = true
dotcore-proto.workspace = true
libc.workspace = true
prost.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net", "process", "rt", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
