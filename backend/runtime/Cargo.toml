[package]
name = "dotcore-runtime"
description = "Owner-neutral runtime contracts: workload intent, observations, logs, site cleanup and host capability probes."
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
anyhow.workspace = true
dotcore-domain = { path = "../domain" }
futures-util.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio-util.workspace = true

[features]
# Test-only source checks for the runtime backends' unit tests; never enabled by production builds.
test-support = []

[dev-dependencies]
dotcore-domain = { path = "../domain", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
