# Production waits go through the backend clock, so a test clock's advance reaches them; real time
# appears only at I/O boundaries, each with a reasoned allow. Test builds allow these (Justfile).
disallowed-methods = [
  { path = "tokio::time::sleep", reason = "wait through the backend clock" },
  { path = "tokio::time::sleep_until", reason = "wait through the backend clock" },
  { path = "tokio::time::timeout", reason = "bound waits through the backend clock" },
  { path = "tokio::time::timeout_at", reason = "bound waits through the backend clock" },
  { path = "tokio::time::interval", reason = "tick through the backend clock" },
  { path = "tokio::time::interval_at", reason = "tick through the backend clock" },
]
