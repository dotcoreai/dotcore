[package]
name = "dotcore-catalog"
description = "Immutable catalog of models, engine releases, applications and upstream model templates, with sizing and the catalog API."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.99"

[dependencies]
anyhow.workspace = true
dotcore-domain.workspace = true
dotcore-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tonic.workspace = true
tracing.workspace = true
url.workspace = true

[features]
# Test-only catalog fixtures for the unit tests of crates above; never enabled by production builds.
test-support = ["dotcore-domain/test-support"]

[dev-dependencies]
dotcore-domain = { path = "../domain", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
