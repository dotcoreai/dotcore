[package]
name = "dotc"
description = "The dotc executable: Site, node, model, application and image cleanup commands, guided prompts and terminal output."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.88"

[[bin]]
name = "dotc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dotcore-artifact.workspace = true
dotcore.workspace = true
dotcore-catalog.workspace = true
dotcore-domain.workspace = true
dotcore-node-hardware.workspace = true
dotcore-proto.workspace = true
dotcore-runtime.workspace = true
dotcore-runtime-backends.workspace = true
dotcore-site.workspace = true
futures-util.workspace = true
getifaddrs = "0.6.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread", "signal", "sync", "time"] }
thiserror.workspace = true
tonic.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
crossterm = { version = "0.29.0", default-features = false, features = ["events", "use-dev-tty"] }
filedescriptor = "0.8.3"
libc.workspace = true
rustls.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[dev-dependencies]
dotcore = { path = "../core", features = ["test-support"] }
tempfile.workspace = true
tonic.workspace = true
vt100 = "0.16.2"
