[package]
name = "dotcore-domain"
description = "Lowest backend layer: shared identifiers, references, platform values, the backend clock and durable file flushes."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow.workspace = true
dotcore-host-process = { path = "../host_process" }
dotcore-proto = { path = "../proto" }
futures-util.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }

[features]
# Test-only controls and fixtures for the unit tests of crates above; never enabled by production builds.
test-support = ["dep:tempfile", "dep:tracing-subscriber"]

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
