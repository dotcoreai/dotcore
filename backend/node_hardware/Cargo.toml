[package]
name = "dotcore-node-hardware"
description = "Node hardware collection: host facts and per-device accelerator observations for NVIDIA, AMD and Apple, and declared machines described as data."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.99"

[dependencies]
anyhow.workspace = true
dotcore-domain.workspace = true
dotcore-host-process.workspace = true
dotcore-nvml.workspace = true
dotcore-proto.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml_ng.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }

[dev-dependencies]
dotcore-domain = { path = "../domain", features = ["test-support"] }
dotcore-host-process = { path = "../host_process", features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
