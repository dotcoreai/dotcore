[workspace]
members = ["artifact", "catalog", "cli", "core", "domain", "host_process", "launcher", "node_hardware", "nvml", "observability", "proto", "runtime", "runtime_backends", "site"]
resolver = "3"

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
fs4 = "0.13.1"
futures-util = "0.3.31"
getrandom = "0.3.4"
libc = "0.2.189"
pbjson = "0.8.0"
prost = "0.14.4"
rcgen = "0.14.10"
rustls = "0.23.43"
serde = "1.0.228"
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
subtle = "2.6.1"
sysinfo = "0.38.4"
tempfile = "3.20.0"
thiserror = "2.0.19"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
tokio = "1.48.0"
tokio-stream = "0.1.17"
tokio-util = "0.7.19"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = "2.5.8"
x509-parser = "0.18.0"
