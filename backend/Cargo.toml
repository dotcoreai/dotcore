[workspace]
members = ["artifact", "catalog", "cli", "core", "domain", "host_process", "launcher", "node_hardware", "nvml", "observability", "proto", "runtime", "runtime_backends", "site"]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/dotcoreai/dotcore"
homepage = "https://dotcore.ai"
readme = "../README.md"

[workspace.dependencies]
# Workspace crates carry the version publishing needs. Their dev-dependencies stay path-only, which
# publishing drops, since the published tests need the repository's fixtures anyway.
dotcore = { path = "core", version = "0.1.0" }
dotcore-artifact = { path = "artifact", version = "0.1.0" }
dotcore-catalog = { path = "catalog", version = "0.1.0" }
dotcore-domain = { path = "domain", version = "0.1.0" }
dotcore-host-process = { path = "host_process", version = "0.1.0" }
dotcore-launcher = { path = "launcher", version = "0.1.0" }
dotcore-node-hardware = { path = "node_hardware", version = "0.1.0" }
dotcore-nvml = { path = "nvml", version = "0.1.0" }
dotcore-observability = { path = "observability", version = "0.1.0" }
dotcore-proto = { path = "proto", version = "0.1.0" }
dotcore-runtime = { path = "runtime", version = "0.1.0" }
dotcore-runtime-backends = { path = "runtime_backends", version = "0.1.0" }
dotcore-site = { path = "site", version = "0.1.0" }

anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
fs4 = "0.13.1"
futures-util = "0.3.31"
getrandom = "0.4.3"
libc = "0.2.189"
pbjson = "0.8.0"
prost = "0.14.4"
rcgen = "0.14.10"
rustls = "0.23.43"
serde = "1.0.228"
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
subtle = "2.6.1"
sysinfo = "0.38.4"
tempfile = "3.20.0"
thiserror = "2.0.19"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
tokio = "1.48.0"
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-stream = "0.1.17"
tokio-util = "0.7.19"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = "2.5.8"
x509-parser = "0.18.0"
