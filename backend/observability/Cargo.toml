[package]
name = "dotcore-observability"
description = "Observability metrics: typed metric descriptors, time-aligned bucket aggregates, the metric store boundary and its in-memory store, and the node metric forwarder and bucket stream ingest."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version = "1.88"

[dependencies]
dotcore-domain.workspace = true
futures-util.workspace = true
getrandom = { workspace = true, features = ["std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[features]
# Test-only fakes for the unit tests of crates above; never enabled by production builds.
test-support = []

[dev-dependencies]
dotcore-domain = { path = "../domain", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
