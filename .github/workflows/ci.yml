name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.task.name }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with `just ci::check`. These tasks run on every platform.
        task:
          - { name: backend lint, recipe: "backend::ci-lint", cargo: lint }
          - { name: backend test 1/2, recipe: "backend::ci-test", part: "1/2", cargo: test }
          - { name: backend test 2/2, recipe: "backend::ci-test", part: "2/2", cargo: test }
          - { name: dev, recipe: "dev::ci-check", nix-upload: true }
        # macOS runners are few and queue under load: PRs run them in `CI macOS`, on request.
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04", "ubuntu-24.04-arm"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]') }}
        # Platform-independent checks run on x86_64 Linux only.
        include:
          - runner: ubuntu-24.04
            task: { name: proto, recipe: "proto::ci-check" }
          - runner: ubuntu-24.04
            task: { name: frontend lint, recipe: "frontend::ci-lint", npm: true }
          - runner: ubuntu-24.04
            task: { name: frontend test 1/2, recipe: "frontend::ci-test", part: "1/2", npm: true }
          - runner: ubuntu-24.04
            task: { name: frontend test 2/2, recipe: "frontend::ci-test", part: "2/2", npm: true }
          - runner: ubuntu-24.04
            task: { name: installer, recipe: "installer::ci-check" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Lets hestia see evicted cache entries upfront.
      actions: read
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ci-task
        with:
          recipe: ${{ matrix.task.recipe }}
          part: ${{ matrix.task.part }}
          cargo: ${{ matrix.task.cargo }}
          npm: ${{ matrix.task.npm || false }}
          nix-upload: ${{ matrix.task.nix-upload || false }}
