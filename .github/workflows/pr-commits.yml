# Fails a PR that isn't a draft while any of its commits is still marked unreviewed or private.
name: PR commits

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-commit-prefixes:
    name: check commit prefixes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check commit prefixes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ci/check-commit-prefixes.sh "$BASE_SHA..$HEAD_SHA"
