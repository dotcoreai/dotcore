syntax = "proto3";

package dotcore.catalog.v1;

import "dotcore/catalog/v1/application.proto";
import "dotcore/catalog/v1/engine_release.proto";
import "dotcore/catalog/v1/hardware_class.proto";
import "dotcore/catalog/v1/model.proto";
import "dotcore/catalog/v1/upstream_model_template.proto";

// Management read API for immutable catalog releases.
service CatalogService {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc ListEngineReleases(ListEngineReleasesRequest) returns (ListEngineReleasesResponse);
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  rpc ListUpstreamModelTemplates(ListUpstreamModelTemplatesRequest) returns (ListUpstreamModelTemplatesResponse);
  rpc ListHardwareClasses(ListHardwareClassesRequest) returns (ListHardwareClassesResponse);
}

// Requests the immutable model releases currently available in the catalog.
message ListModelsRequest {}

// Current immutable model releases from the catalog owner.
message ListModelsResponse {
  // Immutable model releases currently available in the catalog.
  repeated Model models = 1;
}

// Requests the immutable engine releases currently available in the catalog.
message ListEngineReleasesRequest {}

// Current immutable engine releases and parameter schemas from the catalog owner.
message ListEngineReleasesResponse {
  // Immutable engine releases currently available in the catalog.
  repeated EngineRelease engine_releases = 1;
}

// Requests the immutable application releases currently available in the catalog.
message ListApplicationsRequest {}

// Current immutable application releases from the catalog owner.
message ListApplicationsResponse {
  // Immutable application releases currently available in the catalog.
  repeated Application applications = 1;
}

// Requests the immutable upstream model templates currently available in the catalog.
message ListUpstreamModelTemplatesRequest {}

// Current immutable upstream model templates from the catalog owner.
message ListUpstreamModelTemplatesResponse {
  // Immutable upstream model templates currently available in the catalog.
  repeated UpstreamModelTemplate upstream_model_templates = 1;
}

// Requests the shared hardware classes currently available in the catalog.
message ListHardwareClassesRequest {}

// Current shared hardware classes from the catalog owner.
message ListHardwareClassesResponse {
  // Shared hardware classes currently available in the catalog.
  repeated HardwareClass hardware_classes = 1;
}
