syntax = "proto3";

package dotcore.catalog.v1;

import "dotcore/catalog/v1/nix.proto";
import "dotcore/catalog/v1/oci.proto";
import "dotcore/catalog/v1/parameter.proto";
import "dotcore/catalog/v1/storage.proto";

// An immutable artifact-manager catalog declaration for an approved application release.
message Application {
  // Stable identifier for this immutable application release.
  string application_id = 1;

  // Human-readable name for this application release.
  string display_name = 2;

  // Optional practical description of this application release.
  string description = 5;

  // Optional non-secret operator hints shown in the console: plain text, at most 1000 bytes, line breaks allowed.
  string notes = 6;

  // Application release version.
  string version = 3;

  // Immutable runtime-neutral service graph for this application release.
  ApplicationGraph graph = 4;
}

// An immutable graph of named services with exactly one primary endpoint.
message ApplicationGraph {
  // Named services in this application graph.
  repeated ApplicationService services = 1;

  // The one service port that can be projected as the primary endpoint.
  ApplicationPrimaryEndpoint primary_endpoint = 2;

  // Typed parameters operators may set at deployment creation, in display order; each is basic or
  // advanced and, except a secret, declares a default.
  repeated ParameterDefinition parameters = 3;
}

// One named service in an immutable application graph.
message ApplicationService {
  // Stable name for this service in the application graph.
  string service_name = 1;

  // Immutable artifact executed by this service.
  ApplicationServiceArtifact artifact = 2;

  // Exec-form command that overrides the artifact entrypoint when non-empty.
  repeated string command = 3;

  // Exec-form arguments passed to the selected command or artifact entrypoint. When non-empty,
  // they replace the artifact's default arguments.
  repeated string arguments = 4;

  // Named internal TCP ports served by this service.
  repeated ApplicationServicePort ports = 5;

  // Named configuration values that require site-specific resolution.
  repeated ApplicationConfigurationBinding configuration_bindings = 6;

  // Writable storage the apps controller attaches to this service.
  repeated StorageBinding storage_bindings = 7;

  // Secret parameters this service receives, each in the form it needs.
  repeated ApplicationSecretBinding secret_bindings = 8;

  // Conditions on named services that must hold before this service starts.
  repeated ApplicationServiceDependency dependencies = 9;

  // Protocol readiness evaluated by the apps controller when declared.
  ApplicationServiceReadiness readiness = 10;
}

// One immutable artifact of an application service and the platforms it approves.
message ApplicationServiceArtifact {
  // Packaging that provides the service image.
  oneof kind {
    // Immutable OCI image reference.
    OciImageReference oci = 1;

    // Nix flake package providing the service's container image.
    NixArtifact nix = 3;
  }

  // Concrete OCI platforms whose content this artifact approves.
  repeated OciPlatform supported_platforms = 2;
}

// One named internal TCP port served by an application service.
message ApplicationServicePort {
  // Stable port name within the service.
  string port_name = 1;

  // Internal TCP port number.
  uint32 port_number = 2;
}

// One dependency on a named service in the same application graph.
message ApplicationServiceDependency {
  // Name of the service that this service depends on.
  string service_name = 1;

  // Condition that the dependency service must meet.
  ApplicationDependencyCondition condition = 2;
}

// Declares one protocol readiness check for an application service.
message ApplicationServiceReadiness {
  oneof check {
    // HTTP request used to evaluate service readiness.
    ApplicationHttpReadiness http_get = 1;
  }
}

// Declares an HTTP readiness request without asserting current readiness.
message ApplicationHttpReadiness {
  // Name of the service port that receives the readiness request.
  string port_name = 1;

  // Absolute HTTP path requested to evaluate readiness.
  string path = 2;
}

// Declares one non-secret configuration source and its environment destination.
message ApplicationConfigurationBinding {
  // Stable name used by an application deployment to supply the value.
  string binding_name = 1;

  // Environment variable that receives the resolved configuration value.
  string environment_variable = 2;

  oneof source {
    // Literal non-secret value, also the fallback when an optional route input has no linked route.
    string literal_value = 3;

    // Site value resolved at creation: `configured-inference-openai-base-url` or `published-endpoint-url`.
    string resolved_value_name = 4;

    // Graph parameter whose value resolved at creation supplies this binding.
    string parameter_id = 6;
  }

  // Optional deployment input that can project a linked inference route into this binding.
  ApplicationDeploymentInput input = 5;
}

// Describes one deployment input projected into a configuration binding.
message ApplicationDeploymentInput {
  oneof kind {
    // Projects the optionally linked inference route into this configuration binding.
    ApplicationInferenceRouteInput inference_route = 2;
  }
}

// Identifies a deployment input projected from an optionally linked inference route.
message ApplicationInferenceRouteInput {
  // Closed value projection supplied to this configuration binding at launch when a route is linked.
  ApplicationInferenceRouteProjection projection = 1;
}

// One application-neutral value projected from a linked inference route.
enum ApplicationInferenceRouteProjection {
  // The application inference route projection unspecified value.
  APPLICATION_INFERENCE_ROUTE_PROJECTION_UNSPECIFIED = 0;

  // The application inference route projection current route name value.
  APPLICATION_INFERENCE_ROUTE_PROJECTION_ROUTE_NAME = 1;
}

// Declares one secret parameter's environment destination and the form the service receives.
message ApplicationSecretBinding {
  // Stable binding name, unique within the service.
  string binding_name = 1;

  // Environment variable that receives the secret in its form.
  string environment_variable = 2;

  // Graph secret parameter whose value supplies this binding.
  string parameter_id = 3;

  // Form of the value the service receives.
  ApplicationSecretForm form = 4;
}

// Selects the one declared service port that can become the primary endpoint.
message ApplicationPrimaryEndpoint {
  // Name of the service that owns the selected port.
  string service_name = 1;

  // Name of the selected service port.
  string port_name = 2;

  // Protocol projected for the selected service port.
  ApplicationEndpointProtocol protocol = 3;
}

// The form in which a service receives a secret parameter's value.
enum ApplicationSecretForm {
  // Invalid; every secret binding declares its form.
  APPLICATION_SECRET_FORM_UNSPECIFIED = 0;

  // The value exactly as retained.
  APPLICATION_SECRET_FORM_PLAIN = 1;
}

// The condition that a dependency service must meet before a dependent service starts.
enum ApplicationDependencyCondition {
  // The application dependency condition unspecified value.
  APPLICATION_DEPENDENCY_CONDITION_UNSPECIFIED = 0;

  // The application dependency condition started value.
  APPLICATION_DEPENDENCY_CONDITION_STARTED = 1;

  // The application dependency condition ready value.
  APPLICATION_DEPENDENCY_CONDITION_READY = 2;
}

// The application protocol projected through a declared endpoint.
enum ApplicationEndpointProtocol {
  // The application endpoint protocol unspecified value.
  APPLICATION_ENDPOINT_PROTOCOL_UNSPECIFIED = 0;

  // The application endpoint protocol http value.
  APPLICATION_ENDPOINT_PROTOCOL_HTTP = 1;
}
