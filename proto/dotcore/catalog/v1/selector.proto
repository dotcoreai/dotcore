syntax = "proto3";

package dotcore.catalog.v1;

import "dotcore/catalog/v1/oci.proto";
import "dotcore/observation/v1/observation.proto";

// Typed condition over an execution target's platform and observed facts. A dimension the
// selector leaves unset matches any value; the driver minimum is checked after a match.
message Selector {
  // Platform the target must run; a Nix artifact builds for the matching Nix system.
  OciPlatform platform = 1;

  // Accelerator vendors the target may report, any one of them: nvidia or apple.
  repeated string accelerators = 2;

  // Minimum host NVIDIA driver major version; required with nvidia and zero otherwise.
  uint32 minimum_nvidia_driver_major_version = 3;

  // Memory architecture the target's accelerators must report; unspecified matches either.
  dotcore.observation.v1.AcceleratorMemoryArchitecture memory_architecture = 4;

  // Accelerator product names, exactly as reported; every device the target uses must report one.
  // Only hardware classes set it, with an accelerator vendor.
  repeated string device_models = 5;
}
