syntax = "proto3";

package dotcore.catalog.v1;

import "dotcore/catalog/v1/hardware_class.proto";

// A master-catalog declaration of the models to run on one hardware class, per use case, best
// first. Advisory: it never affects admission or placement.
message HardwareClassRecommendations {
  // Hardware class these recommendations apply to; narrower classes without a list for a use case
  // use this one's.
  string hardware_class_id = 1;

  // One priority-ordered list per use case; a use case appears at most once.
  repeated UseCaseRecommendations use_cases = 2;
}

// The priority-ordered models recommended for one use case on one hardware class.
message UseCaseRecommendations {
  // Use case this list serves.
  UseCase use_case = 1;

  // Recommended models, best first.
  repeated ModelRecommendation entries = 2;
}

// One recommended model and the profile to run it with.
message ModelRecommendation {
  // Model to run.
  string model_id = 1;

  // Profile of that model, which pins its engine configuration and quantization.
  string profile_id = 2;

  // Optional memory minimums a machine needs for this entry, on top of the configuration's own.
  HardwareRequirements hardware_requirements = 3;

  // Optional context per request in tokens to size this entry with; the profile's default applies when absent.
  optional uint64 context_tokens_per_request = 4;
}

// What an operator runs models for. Distinct from inference request kinds.
enum UseCase {
  USE_CASE_UNSPECIFIED = 0;

  // General chat assistance.
  USE_CASE_CHAT_ASSISTANT = 1;

  // Coding assistants and autonomous agents.
  USE_CASE_CODING = 2;

  // Generating images.
  USE_CASE_IMAGE_GENERATION = 3;
}
