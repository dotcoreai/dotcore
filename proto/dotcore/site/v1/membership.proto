syntax = "proto3";

package dotcore.site.v1;

import "dotcore/site/v1/service.proto";
import "dotcore/site/v1/site.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Management API for the running site's membership: adding a machine, letting a declared one join
// again, and removing one. Joins live in the site manager's memory only: a manager restart ends
// every join and voids its token. Errors: NOT_FOUND (unknown or ended join), FAILED_PRECONDITION
// (decision that doesn't match the join's current proposal), RESOURCE_EXHAUSTED (too many active
// joins).
service SiteMembershipService {
  // Starts a join and returns the token the joining machine presents.
  rpc StartJoin(StartJoinRequest) returns (StartJoinResponse);

  // Streams a join's state: its current state on open, then every change, ending after a final
  // state. The join is cancelled once no watch has been open on it for a short grace period.
  rpc WatchJoin(WatchJoinRequest) returns (stream WatchJoinResponse);

  // Allows the proposal awaiting approval; the first decision on a proposal wins.
  rpc ApproveJoin(ApproveJoinRequest) returns (ApproveJoinResponse);

  // Refuses the proposal awaiting approval; the join waits for a corrected attempt with the same
  // token.
  rpc RejectJoin(RejectJoinRequest) returns (RejectJoinResponse);

  // Ends a join that has not reached a final state and refuses its token from then on.
  rpc CancelJoin(CancelJoinRequest) returns (CancelJoinResponse);

  // Removes a worker machine from the running site, or previews the removal. A refusal or a
  // machine that is already gone is an outcome of the response, not an error. The removal is
  // recorded durably before the machine loses its access.
  rpc RemoveMachine(RemoveMachineRequest) returns (RemoveMachineResponse);
}

// Requests a new join.
message StartJoinRequest {}

// The started join, waiting for the joining machine.
message StartJoinResponse {
  // Identity of the join, used by every other call.
  string join_id = 1;

  // Encoded join token the joining machine presents; a secret, shown only to the operator.
  string token = 2;

  // Time after which the join expires and its token is refused.
  google.protobuf.Timestamp expires_at = 3;
}

// Requests the state stream of one join.
message WatchJoinRequest {
  // Join to watch.
  string join_id = 1;
}

// One message of a join watch.
message WatchJoinResponse {
  oneof event {
    // The join's state as of now.
    JoinState state = 1;

    // Keeps an idle stream alive, sent after 15 s without any other event.
    google.protobuf.Empty heartbeat = 2;
  }
}

// Allows one proposal of a join.
message ApproveJoinRequest {
  // Join the proposal belongs to.
  string join_id = 1;

  // Proposal being allowed, as its awaiting approval state names it.
  string proposal_id = 2;
}

// Acknowledges the approval; the watch reports the commit or failure that follows.
message ApproveJoinResponse {}

// Refuses one proposal of a join.
message RejectJoinRequest {
  // Join the proposal belongs to.
  string join_id = 1;

  // Proposal being refused, as its awaiting approval state names it.
  string proposal_id = 2;
}

// Acknowledges the rejection.
message RejectJoinResponse {}

// Cancels one join.
message CancelJoinRequest {
  // Join to cancel.
  string join_id = 1;
}

// Acknowledges the cancellation.
message CancelJoinResponse {}

// Removes one worker machine, or previews its removal.
message RemoveMachineRequest {
  // SiteNode identity of the machine to remove.
  string node_id = 1;

  // Withdraws the deployments placed on the machine and the routes they alone serve, without
  // cleanup on the machine; refused while the machine is connected.
  bool forget_deployments = 2;

  // Returns what the removal would change without changing the site.
  bool validate_only = 3;
}

// What the removal did, would do, or why it was refused.
message RemoveMachineResponse {
  oneof outcome {
    // The site no longer has the machine; its access is withdrawn.
    MachineRemovalPlan removed = 1;

    // What the removal would change; nothing was changed.
    MachineRemovalPlan would_remove = 2;

    // No such machine is in the site, for example after an earlier removal.
    google.protobuf.Empty already_removed = 3;

    // Nothing was changed, for the reason given.
    MachineRemovalRefusal refused = 4;
  }
}

// State of one join. Committed, cancelled, expired and failed are final; the others can change.
message JoinState {
  oneof state {
    // No proposal is under review; the token waits for the joining machine.
    JoinWaiting waiting = 1;

    // A joining machine passed the dial-back check and waits for the operator's decision.
    JoinAwaitingApproval awaiting_approval = 2;

    // The site recorded the machine, or the rejoining machine's new addresses.
    JoinCommitted committed = 3;

    // The join was cancelled, by a call or because no watch remained open.
    google.protobuf.Empty cancelled = 4;

    // The join expired before a machine joined.
    google.protobuf.Empty expired = 5;

    // The join ended without recording anything, such as after too many failed attempts.
    JoinFailed failed = 6;
  }
}

// A join waiting for the joining machine, with how its latest attempt ended, if any.
message JoinWaiting {
  // Outcome of the latest attempt that ended without a commit; absent before any attempt.
  JoinAttemptOutcome last_attempt = 1;
}

// A proposal that passed the dial-back check, shown to the operator for a decision.
message JoinAwaitingApproval {
  // Identity of this proposal, echoed by the decision on it.
  string proposal_id = 1;

  // What the machine asks for, with the details for the decision.
  JoinProposal proposal = 2;
}

// A join whose machine the site recorded.
message JoinCommitted {
  // SiteNode identity of the new or rejoined machine.
  string node_id = 1;
}

// A join that ended without recording anything.
message JoinFailed {
  // Human-readable reason, for example too many failed attempts.
  string reason = 1;
}

// How one attempt of a join ended without a commit; the token stays usable.
message JoinAttemptOutcome {
  oneof outcome {
    // The operator refused the proposal.
    google.protobuf.Empty rejected = 1;

    // Human-readable reason the attempt failed, such as a failed dial-back.
    string failed = 2;
  }

  // Wall-clock time the attempt ended, which tells two identical outcomes apart.
  google.protobuf.Timestamp at = 3;
}

// What a joining machine asks for, as the operator reviews it.
message JoinProposal {
  // SiteNode identity derived for a new machine, or the declared one of a rejoining machine.
  string node_id = 1;

  // SiteNode display name, proposed by a new machine or declared for a rejoining one.
  string display_name = 2;

  // IPv4 address or DNS host name the site will record for reaching the machine.
  string host = 3;

  // Where the host comes from.
  JoinHostSource host_source = 4;

  // Address the join connection came from.
  string peer_address = 5;

  // Whether the host, once resolved on the manager, differs from the connection's address.
  bool host_differs_from_peer = 6;

  // Port of the machine's private listener.
  uint32 private_port = 7;

  // Lowercase SHA-256 fingerprint of the machine's key, also shown on the machine next to its
  // fingerprint pattern.
  string key_fingerprint = 8;

  // Visual pattern derived from the key fingerprint, also shown on the machine.
  FingerprintPattern fingerprint_pattern = 11;

  // Whether the machine joins as a new node or as a declared one again.
  oneof kind {
    // A new machine and the execution targets it proposes.
    JoinNewNode new_node = 9;

    // A declared machine joining again from its intact node folder.
    JoinRejoin rejoin = 10;
  }
}

// What removing one machine changes in the site.
message MachineRemovalPlan {
  // SiteNode identity of the machine.
  string node_id = 1;

  // SiteNode display name of the machine.
  string display_name = 2;

  // Execution targets that leave with the machine.
  repeated string execution_target_ids = 3;

  // Deployments withdrawn without cleanup; empty unless forgetting them was asked.
  repeated MachineRemovalDeployment forgotten_deployments = 4;

  // Routes deleted because only forgotten deployments served them.
  repeated MachineRemovalRoute deleted_routes = 5;
}

// Why a removal changed nothing, with what blocks it.
message MachineRemovalRefusal {
  // Kind of refusal.
  MachineRemovalRefusalReason reason = 1;

  // Human-readable explanation, safe to show the operator.
  string message = 2;

  // Deployments placed on the machine, for a refusal because of them.
  repeated MachineRemovalDeployment deployments = 3;

  // Routes that stay but are also served by forgotten deployments, for a route conflict.
  repeated string shared_route_names = 4;

  // Applications that stay but are bound to a route the removal would delete, for a route
  // conflict.
  repeated string linked_application_names = 5;
}

// One model or application deployment placed on the machine being removed.
message MachineRemovalDeployment {
  // Owner that declared the deployment.
  MachineRemovalDeploymentKind kind = 1;

  // Model or application deployment identity.
  string deployment_id = 2;

  // Display name, or the model when a model deployment has none.
  string name = 3;

  // Whether the deployment is being torn down.
  bool tearing_down = 4;
}

// One route a removal deletes.
message MachineRemovalRoute {
  // Inference route identity.
  string inference_route_id = 1;

  // Route name callers use.
  string name = 2;
}

// A small symmetric grid of colored cells derived from a key fingerprint, for a quick visual
// match between two screens; the fingerprint stays the authoritative check.
message FingerprintPattern {
  // The three distinct colors the cells use.
  repeated FingerprintPatternColor colors = 1;

  // 25 cells of a 5 by 5 grid in row-major order: 0 is empty, 1 to 3 index colors from 1.
  repeated uint32 cells = 2;
}

// What a new machine proposes beyond its name and host.
message JoinNewNode {
  // Execution targets the machine proposes, models first; empty when it runs no workloads.
  repeated JoinProposedTarget targets = 1;
}

// What changes when a declared machine joins again; its identity and targets stay.
message JoinRejoin {
  // Host the site declares for the machine now, replaced by the proposal's host.
  string previous_host = 1;

  // Host the machine reaches the manager at now; empty means the manager's declared host.
  string previous_manager_host = 2;

  // Host the machine will reach the manager at; empty means the manager's declared host.
  string manager_host = 3;

  // Model and application deployments placed on the machine, which stay on it.
  uint32 deployments = 4;
}

// One execution target a new machine proposes.
message JoinProposedTarget {
  // Workload kind the target runs.
  ExecutionTargetWorkloadKind workload_kind = 1;

  // Runtime that runs the target's workloads.
  JoinTargetRuntime runtime = 2;

  // Platform the workloads run in, such as linux/amd64.
  string platform_label = 3;

  // Accelerator device identifiers the target holds.
  repeated string accelerator_device_ids = 4;

  // Whether native workloads outlive the server process; unspecified for other runtimes.
  NativeWorkloadLifetime native_workload_lifetime = 5;
}

// One of the six standard terminal colors a fingerprint pattern uses.
enum FingerprintPatternColor {
  FINGERPRINT_PATTERN_COLOR_UNSPECIFIED = 0;

  FINGERPRINT_PATTERN_COLOR_RED = 1;

  FINGERPRINT_PATTERN_COLOR_GREEN = 2;

  FINGERPRINT_PATTERN_COLOR_YELLOW = 3;

  FINGERPRINT_PATTERN_COLOR_BLUE = 4;

  FINGERPRINT_PATTERN_COLOR_MAGENTA = 5;

  FINGERPRINT_PATTERN_COLOR_CYAN = 6;
}

// Where the host proposed for a joining machine comes from.
enum JoinHostSource {
  JOIN_HOST_SOURCE_UNSPECIFIED = 0;

  // The joining machine proposed it.
  JOIN_HOST_SOURCE_PROPOSED = 1;

  // The manager observed it as the join connection's source address.
  JOIN_HOST_SOURCE_OBSERVED = 2;

  // A rejoining machine proposed none, so it keeps its declared host.
  JOIN_HOST_SOURCE_DECLARED = 3;
}

// Runtime of a proposed execution target.
enum JoinTargetRuntime {
  JOIN_TARGET_RUNTIME_UNSPECIFIED = 0;

  // Simulated models or applications.
  JOIN_TARGET_RUNTIME_SIMULATED = 1;

  // Models on one NVIDIA GPU, run through Docker.
  JOIN_TARGET_RUNTIME_NVIDIA = 2;

  // Models on the Apple GPU, run natively.
  JOIN_TARGET_RUNTIME_APPLE = 3;

  // Applications run through Docker.
  JOIN_TARGET_RUNTIME_DOCKER = 4;
}

// Owner of a deployment placed on a machine being removed.
enum MachineRemovalDeploymentKind {
  MACHINE_REMOVAL_DEPLOYMENT_KIND_UNSPECIFIED = 0;

  MACHINE_REMOVAL_DEPLOYMENT_KIND_MODEL = 1;

  MACHINE_REMOVAL_DEPLOYMENT_KIND_APPLICATION = 2;
}

// Why a machine removal changed nothing.
enum MachineRemovalRefusalReason {
  MACHINE_REMOVAL_REFUSAL_REASON_UNSPECIFIED = 0;

  // The machine is the site manager, which can't leave its site.
  MACHINE_REMOVAL_REFUSAL_REASON_MANAGER = 1;

  // Deployments are placed on the machine and forgetting them wasn't asked.
  MACHINE_REMOVAL_REFUSAL_REASON_DEPLOYMENTS_PLACED = 2;

  // Forgetting deployments was asked while the machine is connected; remove them instead.
  MACHINE_REMOVAL_REFUSAL_REASON_CONNECTED = 3;

  // Forgetting the deployments would break routes or applications that stay.
  MACHINE_REMOVAL_REFUSAL_REASON_ROUTE_CONFLICT = 4;

  // The site without the machine would be invalid.
  MACHINE_REMOVAL_REFUSAL_REASON_INVALID_SITE = 5;
}
