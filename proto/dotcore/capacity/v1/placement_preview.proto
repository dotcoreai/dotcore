syntax = "proto3";

package dotcore.capacity.v1;

import "dotcore/capacity/v1/memory.proto";
import "dotcore/deployment/v1/memory_fit.proto";
import "google/protobuf/timestamp.proto";

// What one execution target's memory holds with one configuration added, as the capacity component
// judges it: each memory pool the target draws from, what occupies it, the configuration's demand and the fit line.
message PlacementPreview {
  // Pools the target draws from: its devices in target order, then its node's host pool.
  repeated MemoryPoolPreview pools = 1;

  // Fit of the configuration against every pool's free memory less a headroom, the verdict the compatibility read's free memory fit gives.
  dotcore.deployment.v1.MemoryFit free_memory_fit = 2;

  // When the memory readings the preview used were observed; absent when they never were.
  google.protobuf.Timestamp observed_at = 3;
}

// One memory pool of a placement preview: its occupancy with the configuration's demand, judged against its fit line.
message MemoryPoolPreview {
  // The pool, its segments ending with the configuration's demand.
  MemoryPool pool = 1;

  // Drawn use at or below this line fits: the total less the headroom; absent when the total is unknown.
  optional uint64 fit_line_bytes = 2;

  // Fit of the configuration's demand against this pool's free memory less the headroom, and of declared minimums against its total.
  dotcore.deployment.v1.MemoryFit free_memory_fit = 3;

  // Drawn use past the total when it is beyond it, otherwise past the fit line; zero at or below the fit line, without a demand on the pool, or when unknown.
  uint64 over_by_bytes = 4;

  // Whether the demand takes drawn use beyond the total, not only past the fit line: the pool's use past the total with a demand on it.
  bool beyond_total = 5;
}
