syntax = "proto3";

package dotcore.engine.strata.v1;

// Engine-owned Strata configuration embedded in one catalog model
// configuration. Generic catalog code treats this payload as opaque typed data.
message StrataModelConfiguration {
  // Fixed Strata settings shared by every selection of this configuration.
  StrataFixedModelSettings fixed_settings = 1;

  // Option realizations keyed by generic model option identity.
  repeated StrataOptionRealization option_realizations = 2;
}

// Concrete Strata state retained in a resolved deployment snapshot.
message StrataResolvedModelState {
  // Fixed settings copied from the selected configuration.
  StrataFixedModelSettings fixed_settings = 1;

  // Selected realization evidence keyed by generic model option identity.
  repeated StrataOptionRealization option_realizations = 2;
}

// Maps one generic model option to its Strata realization. Only Strata's Inkling engine realizes
// options.
message StrataOptionRealization {
  // Stable model-local option identifier.
  string option_id = 1;

  oneof realization {
    // Strata realization of a vision option.
    StrataVisionOptionRealization vision = 2;

    // Strata realization of a KV cache precision option.
    StrataKvCachePrecisionOptionRealization kv_cache_precision = 3;
  }
}

// Realizes one vision option for Strata's Inkling engine by loading a separate vision file.
message StrataVisionOptionRealization {
  // Boolean parameter controlling whether the vision file is loaded.
  string enabled_parameter_id = 1;

  // Model-local auxiliary artifact holding the vision file.
  string auxiliary_artifact_id = 2;
}

// Realizes one KV cache precision option for Strata's Inkling engine by passing its precision as
// the engine's KV cache type.
message StrataKvCachePrecisionOptionRealization {}

// Fixed Strata launch inputs. Editable values use generic engine parameter
// schema and value contracts.
message StrataFixedModelSettings {
  // The Strata engine program that runs the model, with its program-specific settings.
  oneof engine_path {
    // Strata's main engine, for GGUF models and the packs built from them.
    StrataMainEngine main_engine = 1;

    // Strata's Inkling engine, for a ready-made Inkling pack file.
    StrataInklingPack inkling_pack = 2;
  }
}

// Settings of a model Strata's main engine runs, drafting with the model's MTP layer.
message StrataMainEngine {
  // Generic engine parameter containing the accelerator memory cap for the model's experts in MiB.
  string expert_vram_mib_parameter_id = 1;

  // Generic engine parameter containing the host memory pinned for the experts beyond the accelerator cap in MiB; empty when the configuration excludes it.
  string expert_host_memory_mib_parameter_id = 2;

  // Model architecture Strata's engine runs, as the model's GGUF names it.
  string architecture = 3;

  // Tokens Strata drafts per step with the model's MTP layer.
  uint32 mtp_draft_tokens = 4;

  // How the model's files reach Strata's engine, which selects its engine path.
  oneof model_files {
    // One GGUF file read in place, drafting with the MTP head inside it.
    StrataSingleGguf single_gguf = 5;

    // Split GGUF shards Strata packs on first start, drafting with a separate draft layer.
    StrataSplitGguf split_gguf = 6;

    // A ready-made Strata pack with its GGUF side files, drafting with a separate draft layer.
    StrataReadyPack ready_pack = 7;
  }
}

// A model artifact snapshot holding exactly one Inkling pack file with the tokenizer files beside it; the pack carries its own drafter.
message StrataInklingPack {}

// A model artifact that is one GGUF file holding the whole model and its MTP head.
message StrataSingleGguf {}

// A model artifact that is one complete set of split GGUF shards in one folder.
message StrataSplitGguf {
  // Model-local auxiliary artifact holding the draft layer's files in one folder.
  string draft_layer_auxiliary_artifact_id = 1;
}

// A model artifact holding a ready-made Strata pack and the GGUF files it reads beside it.
message StrataReadyPack {
  // Model-local auxiliary artifact holding the draft layer's files in one folder.
  string draft_layer_auxiliary_artifact_id = 1;

  // Folder of the pack within the model artifact.
  string pack_path = 2;

  // GGUF file within the model artifact holding the dense weights.
  string dense_gguf_path = 3;

  // GGUF file within the model artifact holding the per-layer embedding lookup table.
  string lookup_table_gguf_path = 4;

  // GGUF file within the model artifact holding the token embedding.
  string token_embedding_gguf_path = 5;
}
