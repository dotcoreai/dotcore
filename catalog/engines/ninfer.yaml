# ninfer image built from the pinned source of `engines/ninfer/docker-image.nix`, loaded from its
# stored image or built locally on the hosting node. ninfer compiles only for
# the GB202 chip (sm_120a) of the RTX 5090 and RTX PRO 6000.
engineReleaseId: "ninfer-13ebb92"
engineKind: "ENGINE_KIND_NINFER"
version: "13ebb92"
parameterSchema:
  schemaId: "ninfer-v3"
  parameters:
    # Shared parameters: the engine adapter in backend/core/src/model/engine/ maps them to flags.
    - parameterId: "total-context"
      displayName: "Total context"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Memory the model holds for all requests at once; requests that start with the same prompt share it. Raise it to serve longer or more simultaneous conversations; when it fills, cached prompts move to host memory, then the newest requests pause."
      unsignedInteger:
        minimum: "1024"
        maximum: "2097152"
        unit: "tokens"
        defaultValue: "32768"
    - parameterId: "context-per-request"
      displayName: "Context per request"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Largest context one request may use. It reserves nothing: requests draw from the total context as they grow. Lower it to stop one long request from filling the total context."
      unsignedInteger:
        minimum: "1024"
        maximum: "262144"
        unit: "tokens"
    - parameterId: "parallel-requests"
      displayName: "Parallel requests"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Requests generated at once; more wait in a queue, and new ones are refused when the queue is full. Each added request uses some extra accelerator memory, so raise it only when several callers use the model together."
      # ninfer's `--max-concurrency` accepts 1 to 8 (docs/startup-configuration.md at 13ebb92).
      unsignedInteger:
        minimum: "1"
        maximum: "8"
        unit: "requests"
        defaultValue: "4"
    - parameterId: "host-context-mib"
      displayName: "Host context memory"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Host memory that keeps idle conversations and paused requests so they resume without processing their prompt again. Raise it for many long conversations that come back; 0 turns it off."
      unsignedInteger:
        minimum: "0"
        maximum: "1048576"
        unit: "MiB"
artifacts:
  - artifactId: "linux-amd64-cuda"
    nix:
      flake: "self"
      package: "engines.ninfer.docker"
      dockerImage: {}
    # Each selector is one set of target facts this build runs on.
    selectors:
      - platform: { operatingSystem: "linux", architecture: "amd64" }
        accelerators: ["nvidia"]
        # The CUDA 13.1 base image runs on the R580 driver branch through CUDA minor version compatibility.
        minimumNvidiaDriverMajorVersion: 580
