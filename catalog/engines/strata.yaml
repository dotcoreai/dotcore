# Strata's CUDA 13 build plus Dotcore's keyless start wrapper, built by
# `engines/strata/docker-image.nix`, loaded from its stored image or built locally on the hosting
# node.
engineReleaseId: "strata-0-2-13"
engineKind: "ENGINE_KIND_STRATA"
version: "0.2.13"
parameterSchema:
  schemaId: "strata-v1"
  parameters:
    # Shared parameters: the engine adapter in backend/core/src/model/engine/ maps them to flags.
    - parameterId: "total-context"
      displayName: "Total context"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Memory the model holds for all requests at once. Each parallel request gets its own share as large as the context per request, so it is always the parallel requests times the context per request; change those two instead."
      unsignedInteger:
        minimum: "1024"
        maximum: "2097152"
        unit: "tokens"
        defaultValue: "32768"
    - parameterId: "context-per-request"
      displayName: "Context per request"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Largest context one request may use. The server sets this much aside for every parallel request from the start, used or not, so keep it as small as your longest request needs."
      unsignedInteger:
        minimum: "1024"
        maximum: "262144"
        unit: "tokens"
    - parameterId: "parallel-requests"
      displayName: "Parallel requests"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Requests generated at once; more wait for a free one. Each holds its own context per request, so raising it multiplies the memory used; raise it only when several callers use the model together."
      # Strata's wrapper accepts 1 to 8 parallel requests (`MAX_PARALLEL` in `engines/strata/start.py`).
      unsignedInteger:
        minimum: "1"
        maximum: "8"
        unit: "requests"
        defaultValue: "1"
    - parameterId: "expert-vram-mib"
      displayName: "Expert accelerator memory"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Accelerator memory the model's experts may use; experts that don't fit stay in host memory and run slower. The model's sizing sets it; raise it to speed up generation if memory allows, or lower it to free accelerator memory."
      unsignedInteger:
        minimum: "1"
        maximum: "1048576"
        unit: "MiB"
# The deployment's own folder for the tokenizer extracted from the model, Strata's run configuration
# and its engine log; the wrapper rebuilds whatever is missing.
storageBindings:
  - bindingName: "data"
    mountPath: "/data"
    kind: "STORAGE_KIND_CACHE"
    placements: ["STORAGE_PLACEMENT_DEPLOYMENT"]
artifacts:
  - artifactId: "linux-amd64-cuda"
    nix:
      flake: "self"
      package: "engines.strata.docker"
      dockerImage: {}
    # Each selector is one set of target facts this build runs on.
    selectors:
      - platform: { operatingSystem: "linux", architecture: "amd64" }
        accelerators: ["nvidia"]
        # The CUDA 13 image runs on the R580 driver branch.
        minimumNvidiaDriverMajorVersion: 580
  - artifactId: "linux-arm64-cuda"
    nix:
      flake: "self"
      package: "engines.strata.docker"
      dockerImage: {}
    # Each selector is one set of target facts this build runs on.
    selectors:
      - platform: { operatingSystem: "linux", architecture: "arm64" }
        accelerators: ["nvidia"]
        # The CUDA 13 engine package runs on the R580 driver branch.
        minimumNvidiaDriverMajorVersion: 580
