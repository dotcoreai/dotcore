# Official llama.cpp macOS arm64 release packaged in engines/llama-cpp and exposed by the repository
# flake as `engines.llama-cpp.native`. The packaged master catalog rewrites `self` to the locked Dotcore
# revision with precomputed store paths, and fails unless the version equals the engine package
# version (checked by `checks.dotcore-catalog`).
engineReleaseId: "llama-cpp-2026-11-13"
engineKind: "ENGINE_KIND_LLAMA_CPP"
version: "b12359" # v1.0.0
parameterSchema:
  schemaId: "llama-cpp-v2"
  parameters:
    # Shared parameters: the engine adapter in backend/core/src/model/engine/ maps them to flags.
    - parameterId: "total-context"
      displayName: "Total context"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Memory the model holds for all requests at once; each active request stores its tokens in it, even when prompts start the same. Raise it to serve longer or more simultaneous conversations; when it fills, idle requests are dropped first, then active ones fail."
      unsignedInteger:
        minimum: "1024"
        maximum: "16777216"
        unit: "tokens"
        defaultValue: "32768"
    - parameterId: "context-per-request"
      displayName: "Context per request"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Largest context one request may use. It reserves nothing: requests draw from the total context as they grow. Lower it to stop one long request from filling the total context."
      unsignedInteger:
        minimum: "1024"
        maximum: "16777216"
        unit: "tokens"
    - parameterId: "parallel-requests"
      displayName: "Parallel requests"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Requests generated at once; more wait in a queue. They share the total context, so raising it adds little memory; raise it when several people or agents use the model together."
      unsignedInteger:
        minimum: "1"
        maximum: "64"
        unit: "requests"
        defaultValue: "4"
    - parameterId: "prompt-cache-memory-mib"
      displayName: "Prompt cache memory"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Host memory used to reuse repeated prompts, such as agent system prompts, without processing them again. Raise it if the same long prompts come back often; on unified-memory machines it competes with the model, and 0 turns it off."
      unsignedInteger:
        minimum: "0"
        maximum: "65536"
        unit: "MiB"
artifacts:
  - artifactId: "metal"
    nix:
      flake: "self"
      package: "engines.llama-cpp.native"
      executable: "llama-server"
    # Each selector is one set of target facts this build runs on.
    selectors:
      - platform: { operatingSystem: "darwin", architecture: "arm64" }
        accelerators: ["apple"]
