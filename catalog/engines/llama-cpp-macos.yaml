# Official llama.cpp macOS arm64 release packaged in engines/llama-cpp and exposed by the repository
# flake as `engines.llama-cpp.native`. The packaged master catalog rewrites `self` to the locked Dotcore
# revision with precomputed store paths, and fails unless the version equals the engine package
# version (checked by `checks.dotcore-catalog`).
engineReleaseId: "llama-cpp-2026-11-13"
engineKind: "ENGINE_KIND_LLAMA_CPP"
version: "b12359" # v1.0.0
parameterSchema:
  schemaId: "llama-cpp-v2"
  parameters:
    # Shared parameters: the engine adapter in backend/core/src/model/engine/ maps them to flags.
    - parameterId: "total-context"
      displayName: "Total context"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Memory the model holds for all requests at once; each active request stores its tokens in it, even when prompts start the same. It follows the context per request times the parallel requests unless you set it. When it fills, idle requests give up their share first, kept in the prompt cache when it is on, then active ones fail."
      summary: "Context memory shared by all requests."
      # At least Dotcore's context floor. `--ctx-size` (`common/arg.cpp`) takes an int, so at most
      # the int32 maximum; llama.cpp pads it to whole 256-token blocks (`src/llama-context.cpp`).
      unsignedInteger:
        minimum: "512"
        maximum: "2147483647"
        unit: "tokens"
    - parameterId: "context-per-request"
      displayName: "Context per request"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Largest context one request may use. It reserves nothing: requests draw from the total context as they grow. Lower it to stop one long request from filling the total context."
      summary: "Longest conversation one request can hold."
      # At least Dotcore's context floor; `--kv-unified-per-slot` (`common/arg.cpp`) takes an int,
      # so at most the int32 maximum.
      unsignedInteger:
        minimum: "512"
        maximum: "2147483647"
        unit: "tokens"
        defaultValue: "32768"
    - parameterId: "parallel-requests"
      displayName: "Parallel requests"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Requests generated at once; more wait in a queue. The total context grows with them unless you set it, so each added request adds memory; raise it when several people or agents use the model together."
      summary: "How many requests run at the same time."
      # The server's `-np` refuses 0 (`common/arg.cpp`), and at most `LLAMA_MAX_SEQ` sequences
      # (`src/llama-cparams.h`); `src/llama-context.cpp` refuses more.
      # A model with classifier-free guidance doubles its sequences (`common/common.cpp`), so it
      # could run only half; no catalog model enables it.
      unsignedInteger:
        minimum: "1"
        maximum: "256"
        unit: "requests"
        defaultValue: "4"
    - parameterId: "prompt-cache-memory-mib"
      displayName: "Prompt cache memory"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Host memory used to reuse repeated prompts, such as agent system prompts, without processing them again. Raise it if the same long prompts come back often; on unified-memory machines it competes with the model, and 0 turns it off."
      summary: "Host memory to reuse repeated prompts; 0 turns it off."
      # `--cache-ram` (`common/arg.cpp`) takes an int in MiB, and 0 turns the cache off: 0 to the
      # int32 maximum. Its negative "no limit" has no unsigned form.
      unsignedInteger:
        minimum: "0"
        maximum: "2147483647"
        unit: "MiB"
        memoryPool: "MEMORY_POOL_HOST"
artifacts:
  - artifactId: "metal"
    nix:
      flake: "self"
      package: "engines.llama-cpp.native"
      executable: "llama-server"
    # Each selector is one set of target facts this build runs on.
    selectors:
      - platform: { operatingSystem: "darwin", architecture: "arm64" }
        accelerators: ["apple"]
