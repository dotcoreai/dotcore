# Official vLLM release image, pinned per architecture by `engines/vllm/docker-image.nix`. The
# unsuffixed tag is the CUDA 13 build that the R580 driver floor covers; the `-cu129` tag variant is
# a CUDA 12.9 build.
engineReleaseId: "vllm-v0-32-0"
engineKind: "ENGINE_KIND_VLLM"
version: "v0.32.0"
parameterSchema:
  schemaId: "vllm-v2"
  parameters:
    # Shared parameters: the engine adapter in backend/core/src/model/engine/ maps them to flags.
    - parameterId: "total-context"
      displayName: "Total context"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Memory the model holds for all requests at once; requests that start with the same prompt share it. Raise it to serve longer or more simultaneous conversations; when it fills, the newest requests pause and are processed again once memory frees up."
      unsignedInteger:
        minimum: "1024"
        maximum: "16777216"
        unit: "tokens"
        defaultValue: "32768"
    - parameterId: "context-per-request"
      displayName: "Context per request"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "Largest context one request may use. It reserves nothing: requests draw from the total context as they grow. Lower it to stop one long request from filling the total context."
      unsignedInteger:
        minimum: "1024"
        maximum: "1048576"
        unit: "tokens"
    - parameterId: "parallel-requests"
      displayName: "Parallel requests"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Requests generated at once; more wait in a queue. Each one also holds model state of its own, so every added request uses more memory; raise it when several callers use the model together."
      unsignedInteger:
        minimum: "1"
        maximum: "1024"
        unit: "requests"
        defaultValue: "4"
    - parameterId: "maximum-batched-tokens"
      displayName: "Maximum batched tokens"
      visibility: "PARAMETER_VISIBILITY_HIDDEN"
      description: "Most tokens processed in one step across all requests. Higher values read long prompts faster but use more memory; lower them if the model runs out of memory while reading prompts."
      unsignedInteger:
        minimum: "1"
        maximum: "1048576"
        unit: "tokens"
    - parameterId: "maximum-cudagraph-capture-size"
      displayName: "Maximum CUDA graph capture size"
      visibility: "PARAMETER_VISIBILITY_HIDDEN"
      description: "Largest group of requests whose GPU work is recorded ahead of time for faster generation. Lower it to save a little memory and start-up time if you never run that many requests at once."
      unsignedInteger:
        minimum: "1"
        maximum: "1024"
        unit: "sequences"
    - parameterId: "kv-cache-memory-bytes"
      displayName: "KV cache memory"
      visibility: "PARAMETER_VISIBILITY_HIDDEN"
      description: "Accelerator memory set aside for the total context. The model's sizing sets it from the total context, so change it only to override that estimate."
      unsignedInteger:
        minimum: "1"
        maximum: "1099511627776"
        unit: "bytes"
    - parameterId: "kv-offloading-size-gib"
      displayName: "KV offloading size"
      visibility: "PARAMETER_VISIBILITY_ADVANCED"
      description: "Host memory that keeps context evicted from the total context, so a later request with the same prompt start reuses it instead of processing it again. Raise it for long prompts that repeat; 0 turns it off."
      unsignedInteger:
        minimum: "0"
        maximum: "1024"
        unit: "GiB"
# Engine compile and tuning caches, shared by every deployment on the same engine build: vLLM's
# torch.compile cache and FlashInfer autotune results (under its cache root), Triton kernels and
# FlashInfer JIT kernels. The variables point each at the mount whatever the image's user and home
# directory. They avoid `XDG_CACHE_HOME`, which would also move unrelated caches such as Hugging
# Face and pip into the shared folder.
storageBindings:
  - bindingName: "engine-cache"
    mountPath: "/var/cache/dotcore-engine"
    kind: "STORAGE_KIND_CACHE"
    placements: ["STORAGE_PLACEMENT_ENGINE_ARTIFACT"]
    environment:
      - { name: "VLLM_CACHE_ROOT", relativePath: "vllm" }
      - { name: "TRITON_CACHE_DIR", relativePath: "triton" }
      - { name: "FLASHINFER_WORKSPACE_BASE" }
# The image and its digests are pinned by `engines/vllm/docker-image.nix`.
artifacts:
  - artifactId: "linux-amd64-cuda"
    nix:
      flake: "self"
      package: "engines.vllm.docker"
      dockerImage: {}
    # Each selector is one set of target facts this build runs on.
    selectors:
      - platform: { operatingSystem: "linux", architecture: "amd64" }
        accelerators: ["nvidia"]
        minimumNvidiaDriverMajorVersion: 580
  - artifactId: "linux-arm64-cuda"
    nix:
      flake: "self"
      package: "engines.vllm.docker"
      dockerImage: {}
    # Each selector is one set of target facts this build runs on.
    selectors:
      - platform: { operatingSystem: "linux", architecture: "arm64" }
        accelerators: ["nvidia"]
        minimumNvidiaDriverMajorVersion: 580
