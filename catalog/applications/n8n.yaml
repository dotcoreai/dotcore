# Immutable n8n graph running the unmodified upstream image. The command seeds
# one OpenAI-compatible credential that points at the configured Inference
# endpoint, then starts n8n. The owner account is created from environment
# values: the email and password come from parameters, and n8n takes the password as a bcrypt hash.
applicationId: "n8n"
displayName: "n8n"
description: "Workflow automation with an Inference endpoint credential already configured."
notes: |-
  Sign in with the email and password in this deployment's sidebar.
  A Dotcore Inference credential points at this Site's Inference endpoint; pick it in OpenAI nodes.
  OpenAI node "Message a model": under Options, add Store and turn it off. Dotcore does not keep responses.
version: "2.43.5"
graph:
  parameters:
    - parameterId: "owner-email"
      displayName: "Owner email"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "The email address for logging in to n8n as its owner."
      text:
        minimumLength: 3
        maximumLength: 254
        defaultValue: "admin@dotcore.local"
    - parameterId: "owner-password"
      displayName: "Owner password"
      visibility: "PARAMETER_VISIBILITY_BASIC"
      description: "The password for logging in to n8n as its owner. Leave it empty to generate a random one, which you can read in the deployment's sidebar."
      secret:
        generatedLength: 32
        minimumLength: 12
  services:
    - serviceName: "web"
      # The image and its digests are pinned by `apps/n8n/docker-image.nix`.
      artifact:
        nix:
          flake: "self"
          package: "apps.n8n.docker"
          dockerImage: {}
        supportedPlatforms:
          - operatingSystem: "linux"
            architecture: "amd64"
          - operatingSystem: "linux"
            architecture: "arm64"
      command:
        - "tini"
        - "--"
        - "/bin/sh"
        - "-c"
        # One line: Docker Runtime rejects control characters in command values. A stable credential
        # ID makes every start overwrite the credential with the current Inference URL; the key is a
        # fixed non-secret placeholder because the Inference API requires none.
        - >-
          set -eu;
          url=${DOTCORE_INFERENCE_BASE_URL:-};
          case $url in http://*/v1 | https://*/v1) ;;
          *) echo 'DOTCORE_INFERENCE_BASE_URL must be an HTTP(S) Inference API URL ending in /v1.' >&2; exit 64 ;; esac;
          case $url in *[!]A-Za-z0-9./:_[-]*)
          echo 'DOTCORE_INFERENCE_BASE_URL contains unsupported characters.' >&2; exit 64 ;; esac;
          printf '[{"id":"dotcoreInference","name":"Dotcore Inference","type":"openAiApi","data":{"apiKey":"dotcore-no-key","url":"%s"}}]' "$url" >/tmp/dotcore-credentials.json;
          n8n import:credentials --input=/tmp/dotcore-credentials.json;
          exec n8n start
      ports:
        - portName: "http"
          portNumber: 5678
      configurationBindings:
        - bindingName: "owner-managed-by-env"
          environmentVariable: "N8N_INSTANCE_OWNER_MANAGED_BY_ENV"
          literalValue: "true"
        - bindingName: "owner-email"
          environmentVariable: "N8N_INSTANCE_OWNER_EMAIL"
          parameterId: "owner-email"
        - bindingName: "owner-first-name"
          environmentVariable: "N8N_INSTANCE_OWNER_FIRST_NAME"
          literalValue: "Admin"
        - bindingName: "owner-last-name"
          environmentVariable: "N8N_INSTANCE_OWNER_LAST_NAME"
          literalValue: "Dotcore"
        - bindingName: "secure-cookie"
          environmentVariable: "N8N_SECURE_COOKIE"
          literalValue: "false"
        - bindingName: "diagnostics"
          environmentVariable: "N8N_DIAGNOSTICS_ENABLED"
          literalValue: "false"
        - bindingName: "version-notifications"
          environmentVariable: "N8N_VERSION_NOTIFICATIONS_ENABLED"
          literalValue: "false"
        - bindingName: "personalization"
          environmentVariable: "N8N_PERSONALIZATION_ENABLED"
          literalValue: "false"
        # The n8n Assistant requires a separate code sandbox service that this graph does not run,
        # so its setup cannot be finished; the module is turned off.
        - bindingName: "assistant-disabled"
          environmentVariable: "N8N_DISABLED_MODULES"
          literalValue: "instance-ai"
        - bindingName: "inference-base-url"
          environmentVariable: "DOTCORE_INFERENCE_BASE_URL"
          resolvedValueName: "configured-inference-openai-base-url"
        # The deployment's own published URL, so the editor shows and registers webhook URLs that
        # callers can reach; n8n adds the trailing slash itself.
        - bindingName: "webhook-url"
          environmentVariable: "WEBHOOK_URL"
          resolvedValueName: "published-endpoint-url"
        - bindingName: "editor-base-url"
          environmentVariable: "N8N_EDITOR_BASE_URL"
          resolvedValueName: "published-endpoint-url"
      secretBindings:
        # n8n accepts only a bcrypt hash of the owner password.
        - bindingName: "owner-password-hash"
          environmentVariable: "N8N_INSTANCE_OWNER_PASSWORD_HASH"
          parameterId: "owner-password"
          form: "APPLICATION_SECRET_FORM_BCRYPT"
      storageBindings:
        - bindingName: "data"
          mountPath: "/home/node/.n8n"
          kind: "STORAGE_KIND_DATA"
          scope: "STORAGE_SCOPE_DEPLOYMENT"
      readiness:
        httpGet:
          portName: "http"
          path: "/healthz"
  primaryEndpoint:
    serviceName: "web"
    portName: "http"
    protocol: "APPLICATION_ENDPOINT_PROTOCOL_HTTP"
