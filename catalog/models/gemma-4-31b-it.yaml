# Non-QAT conversion supplies all three Q3/Q4/Q5 tiers.
# Qualification tier: q4-xl on Linux NVIDIA; footprint measurement is pending.
# MTP is exposed on llama.cpp through Unsloth's draft GGUF and on vLLM through Google's bf16 assistant checkpoint.
# vLLM MTP is unverified: the NVFP4 target does not fit the RTX 5090, so it first runs on a GB10.
