# Immutable provenance for Qwen3.5 4B's public GGUF tiers.
# Qualification tier: q4-xl on Linux NVIDIA. Sizing equations measured on a GB10 host (NVIDIA GB10,
# unified 121.63 GiB host pool, linux/arm64) against llama-cpp-linux-2026-10-05 cuda13, at contexts
# 4096-131072 tokens with vision off and on; the amd64 platform inherits the arm64 measurement.
modelId: "qwen3-5-4b"
displayName: "Qwen3.5 4B"
version: "3.5-4b"
# max_position_embeddings in the Qwen/Qwen3.5-4B config.json (revision 851bf6e).
maximumContextTokens: 262144
options:
  - optionId: "vision"
    displayName: "Vision"
    vision: {}
artifacts:
  - artifactId: "q3-xl"
    weightQuantization: "Q3_K_XL"
    source:
      repository: "unsloth/Qwen3.5-4B-GGUF"
      revision: "e87f176479d0855a907a41277aca2f8ee7a09523"
      file:
        path: "Qwen3.5-4B-UD-Q3_K_XL.gguf"
        provenanceDigest: "1874727e4bb6ac23fd0cd134ac6562d2759fe44f37fa68c55197b36526da4e37"
  - artifactId: "q4-xl"
    weightQuantization: "Q4_K_XL"
    source:
      repository: "unsloth/Qwen3.5-4B-GGUF"
      revision: "e87f176479d0855a907a41277aca2f8ee7a09523"
      file:
        path: "Qwen3.5-4B-UD-Q4_K_XL.gguf"
        provenanceDigest: "b252c5610a42ca82d20fe2a12813e9d069eed89292907e26c783eeb0bc961bc7"
  - artifactId: "q5-xl"
    weightQuantization: "Q5_K_XL"
    source:
      repository: "unsloth/Qwen3.5-4B-GGUF"
      revision: "e87f176479d0855a907a41277aca2f8ee7a09523"
      file:
        path: "Qwen3.5-4B-UD-Q5_K_XL.gguf"
        provenanceDigest: "b4c36a8e14a80c21bcab5a067ce342b2e70e28f60b4aa95ad12203fa17b87426"
auxiliaryArtifacts:
  - auxiliaryArtifactId: "vision-projector"
    source:
      repository: "unsloth/Qwen3.5-4B-GGUF"
      revision: "e87f176479d0855a907a41277aca2f8ee7a09523"
      file:
        path: "mmproj-F16.gguf"
        provenanceDigest: "cd88edcf8d031894960bb0c9c5b9b7e1fea6ebee02b9f7ce925a00d12891f864"
configurations:
  # One llama.cpp configuration for every platform: placement picks the CUDA image on Linux NVIDIA
  # targets and the Metal binary on macOS native targets; both releases share a parameter schema.
  - configurationId: "llama-cpp"
    engineArtifacts:
      - engineReleaseId: "llama-cpp-linux-2026-11-13"
        engineArtifactId: "cuda13"
      - engineReleaseId: "llama-cpp-2026-11-13"
        engineArtifactId: "metal"
    artifactBindings:
      - bindingId: "q3-xl"
        modelArtifactId: "q3-xl"
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
      - bindingId: "q5-xl"
        modelArtifactId: "q5-xl"
    # Sizing shared by every hardware class and binding. Each hardware support entry sets the class
    # parameters once and the binding parameters for every binding. Each constant has exactly one home
    # (shared, class or binding), so shared constants cannot be overridden.
    sizing:
      classParameters: ["promptCacheOnAccelerator", "baseOffsetBytes"]
      bindingParameters: ["baseAccelBytes", "accelBytesPerContextToken", "marginBytes"]
      parameters:
        # Per-slot llama.cpp state: Gated DeltaNet recurrent state, sized from the Qwen/Qwen3.5-4B
        # config.json (revision 851bf6e): 24 linear-attention layers x (conv 3 x 8192 + state 32 heads
        # x 128 x 128) f32 values.
        # baseAccelBytes values exclude it: each is the 4-slot measurement minus 4 x slotStateBytes.
        slotStateBytes: 52690944
        visionBytes: 700841984
      estimates:
        # The prompt cache lives in host memory. Where the accelerator allocates from the host pool
        # (promptCacheOnAccelerator 1), it counts in accelerator memory instead and the host memory
        # estimate is unavailable.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + ${baseOffsetBytes}
            + ${accelBytesPerContextToken} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
          allowance: >-
            ${promptCacheOnAccelerator} * ${prompt-cache-memory-mib} * MiB
            + ${marginBytes}
        hostMemory:
          unit: bytes
          availableWhen: "${promptCacheOnAccelerator} == 0"
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "nvidia-unified"
        # The prompt cache shares the unified pool with the model.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Measured on an NVIDIA GB10 host: unified host pool, linux/arm64, contexts 4096-131072.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 2707734526
              accelBytesPerContextToken: 33792
              marginBytes: 134217728
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 3183394813
              accelBytesPerContextToken: 33792
              marginBytes: 134217728
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 3522150397
              accelBytesPerContextToken: 33792
              marginBytes: 134217728
      - hardwareClassId: "nvidia-dedicated"
        # The prompt cache stays in host memory, outside the GPU's own memory.
        parameters:
          promptCacheOnAccelerator: 0
          # Derived, not measured: 400 MiB, since the GB10 base terms read 319-374 MiB low on
          # the RTX 5090 host smoke runs of the speculative decoding project (b11429).
          baseOffsetBytes: 419430400
        # The binding parameters are the nvidia-unified (GB10) values verbatim until measured on
        # dedicated memory, so a GB10 remeasurement updates both classes.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 2707734526
              accelBytesPerContextToken: 33792
              marginBytes: 134217728
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 3183394813
              accelBytesPerContextToken: 33792
              marginBytes: 134217728
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 3522150397
              accelBytesPerContextToken: 33792
              marginBytes: 134217728
      - hardwareClassId: "apple"
        # Apple Silicon is always unified memory.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Derived, not measured: the GB10 nvidia-cuda equation adjusted to the macOS process
        # footprint with the gemma-4-e2b Metal calibration.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 4008659441
              accelBytesPerContextToken: 38185
              marginBytes: 134217728
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 4508102742
              accelBytesPerContextToken: 38185
              marginBytes: 134217728
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 4863796106
              accelBytesPerContextToken: 38185
              marginBytes: 134217728
    engineConfiguration:
      engineKind: "ENGINE_KIND_LLAMA_CPP"
      llamaCpp:
        fixedSettings:
          gpuLayers: 99
          flashAttention: true
          jinja: true
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
              auxiliaryArtifactId: "vision-projector"
              imageInputCapacity:
                maximumImageCount: 1
                supportedMediaTypes: ["LLAMA_CPP_IMAGE_MEDIA_TYPE_JPEG", "LLAMA_CPP_IMAGE_MEDIA_TYPE_PNG"]
                maximumEncodedBytes: "20971520"
                maximumDecodedBytes: "67108864"
                maximumWidth: 8192
                maximumHeight: 8192
                maximumPixels: "16000000"
                fixedVisualTokens: 256
                fixedDetail: "LLAMA_CPP_IMAGE_DETAIL_AUTO"
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
profiles:
  - profileId: "q3-xl"
    displayName: "Unsloth Q3_K_XL"
    description: "Uses the smaller Q3 weights."
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q3-xl"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
    optionDefaults:
      - optionId: "vision"
        values:
          - parameterId: "enabled"
            boolean: false
  - profileId: "q4-xl"
    displayName: "Unsloth Q4_K_XL"
    description: "Uses the balanced Q4 weights."
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q4-xl"
    engineParameterDefaults:
      values:
