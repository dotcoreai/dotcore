# Immutable provenance for Ornith 1.5 35B A3B's public FP8, NVFP4 and GGUF builds.
# Ornith 1.5 35B A3B is a Qwen3.5 35B A3B derivative with the same architecture as Qwen3.6 35B A3B, so its
# llama.cpp sizing is derived from the measured qwen3-6-35b-a3b constants; its vLLM sizing is measured.
# FP8 needs more memory per device than a 32 GB GPU holds, so it has its own configuration and minimums.
# Both vLLM builds keep the MTP head and vision tower unquantized, at the same tensor sizes as Qwen3.6 35B A3B.
# Each GGUF tier embeds the MTP head with the same layout as the Unsloth Qwen3.6 MTP GGUFs, and llama.cpp uses
# the chat template embedded in the GGUF.
