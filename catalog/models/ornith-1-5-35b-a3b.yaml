        modelArtifactId: "q4-k-m"
      - bindingId: "q5-k-m"
        modelArtifactId: "q5-k-m"
      - bindingId: "q6-k"
        modelArtifactId: "q6-k"
      - bindingId: "q8-0"
        modelArtifactId: "q8-0"
    # Derived, not measured: the qwen3-6-35b-a3b llama.cpp equation and constants, with each tier's weight
    # terms adjusted from the closest qwen3-6 tier (q4-xl for Q4_K_M, q5-xl for the others):
    # baseAccelBytes = qwen3-6 base + main-weight tensor difference (GGUF tensors outside the MTP block),
    # mtpBaseBytes = this tier's MTP block + the same 180 MiB draft growth. Per-token, recurrent and
    # margin terms carry over verbatim, and baseAccelBytes excludes the per-slot state (see slotStateBytes). visionBytes = qwen3-6 value + projector file difference (+3,538,560 B).
    # Every tier is sized on every class; Q8_0 needs more than a 32 GB GPU holds at the default context.
    sizing:
      classParameters: ["promptCacheOnAccelerator", "baseOffsetBytes"]
      bindingParameters: ["baseAccelBytes", "accelBytesPerContextToken", "mtpBaseBytes", "marginBytes"]
      parameters:
        mtpBytesPerContextToken: 2048
        # Per-slot llama.cpp state: Gated DeltaNet recurrent state, the same architecture as
        # qwen3-6-35b-a3b (30 linear-attention layers x (conv 3 x 8192 + state 32 heads x 128 x 128) f32
        # values). Each MTP draft token keeps one more copy per slot. baseAccelBytes values exclude it:
        # each is the 4-slot derived value minus 4 x slotStateBytes.
        slotStateBytes: 65863680
        visionBytes: 934346368
      estimates:
        # The prompt cache lives in host memory. Where the accelerator allocates from the host pool
        # (promptCacheOnAccelerator 1), it counts in accelerator memory instead and the host memory
        # estimate is unavailable.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + ${baseOffsetBytes}
            + ${accelBytesPerContextToken} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + if(${options.mtp.token-count} > 0, 1, 0)
            * (${mtpBaseBytes} + ${mtpBytesPerContextToken} * ${total-context})
            + ${options.mtp.token-count} * ${parallel-requests} * ${slotStateBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
          allowance: >-
            ${promptCacheOnAccelerator} * ${prompt-cache-memory-mib} * MiB
            + ${marginBytes}
        hostMemory:
          unit: bytes
          availableWhen: "${promptCacheOnAccelerator} == 0"
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "nvidia-unified"
        # The prompt cache shares the unified pool with the model.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        bindingSizing:
          # Derived from qwen3-6 q4-xl (GB10): main-weight difference -1,158,046,240 B.
          - bindingId: "q4-k-m"
            parameters:
              baseAccelBytes: 20934714122
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 735447040
              marginBytes: 134217728
          # Derived from qwen3-6 q5-xl (GB10): main-weight difference -1,798,365,728 B.
          - bindingId: "q5-k-m"
            parameters:
              baseAccelBytes: 24497087238
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 807143424
              marginBytes: 134217728
          # Extrapolated from qwen3-6 q5-xl (GB10): main-weight difference +1,986,655,712 B.
          - bindingId: "q6-k"
            parameters:
              baseAccelBytes: 28282108678
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 883320832
              marginBytes: 134217728
          # Extrapolated from qwen3-6 q5-xl (GB10): main-weight difference +10,375,642,240 B.
          - bindingId: "q8-0"
            parameters:
              baseAccelBytes: 36671095206
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 1087752192
              marginBytes: 134217728
      - hardwareClassId: "nvidia-dedicated"
        # The prompt cache stays in host memory, outside the GPU's own memory.
        parameters:
          promptCacheOnAccelerator: 0
          # The qwen3-6 dedicated-memory offset (400 MiB, from its RTX 5090 smoke runs).
          baseOffsetBytes: 419430400
        # The binding parameters are the nvidia-unified values verbatim, as in qwen3-6.
        bindingSizing:
          - bindingId: "q4-k-m"
            parameters:
              baseAccelBytes: 20934714122
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 735447040
              marginBytes: 134217728
          - bindingId: "q5-k-m"
            parameters:
              baseAccelBytes: 24497087238
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 807143424
              marginBytes: 134217728
          - bindingId: "q6-k"
            parameters:
              baseAccelBytes: 28282108678
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 883320832
              marginBytes: 134217728
          - bindingId: "q8-0"
            parameters:
              baseAccelBytes: 36671095206
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 1087752192
              marginBytes: 134217728
      - hardwareClassId: "apple"
        # Apple Silicon is always unified memory.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Derived from the qwen3-6 apple constants, whose Metal base is 1.05 x (Linux base + 1.1 GB), so each
        # base adds 1.05 x the main-weight difference above. Other terms match qwen3-6 apple verbatim.
        bindingSizing:
          - bindingId: "q4-k-m"
            parameters:
              baseAccelBytes: 23151405076
              accelBytesPerContextToken: 24300
              mtpBaseBytes: 735447040
              marginBytes: 134217728
          - bindingId: "q5-k-m"
            parameters:
              baseAccelBytes: 26893364855
              accelBytesPerContextToken: 24300
              mtpBaseBytes: 807143424
              marginBytes: 134217728
          - bindingId: "q6-k"
            parameters:
              baseAccelBytes: 30867637367
              accelBytesPerContextToken: 24300
              mtpBaseBytes: 883320832
              marginBytes: 134217728
          - bindingId: "q8-0"
            parameters:
              baseAccelBytes: 39676073221
              accelBytesPerContextToken: 24300
              mtpBaseBytes: 1087752192
              marginBytes: 134217728
    engineConfiguration:
      engineKind: "ENGINE_KIND_LLAMA_CPP"
      llamaCpp:
        fixedSettings:
          gpuLayers: 99
          flashAttention: true
          jinja: true
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
              auxiliaryArtifactId: "vision-projector"
              imageInputCapacity:
                maximumImageCount: 1
                supportedMediaTypes: ["LLAMA_CPP_IMAGE_MEDIA_TYPE_JPEG", "LLAMA_CPP_IMAGE_MEDIA_TYPE_PNG"]
                maximumEncodedBytes: "20971520"
                maximumDecodedBytes: "67108864"
                maximumWidth: 8192
                maximumHeight: 8192
                maximumPixels: "16000000"
                fixedVisualTokens: 256
                fixedDetail: "LLAMA_CPP_IMAGE_DETAIL_AUTO"
          - optionId: "mtp"
            mtp: { draft: { embedded: {} } }
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
      # Ornith publishes no draft token recommendation; 2 follows the Qwen3.6 35B A3B model card.
      - optionId: "mtp"
        parameters:
          - parameterId: "token-count"
            displayName: "Token count"
            unsignedInteger: { minimum: "0", maximum: "8", unit: "tokens" }
        defaultValues:
          optionId: "mtp"
          values:
            - parameterId: "token-count"
              unsignedInteger: "2"
