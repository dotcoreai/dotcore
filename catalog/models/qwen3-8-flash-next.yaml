            provenanceDigest: "325e5e0d85c262a8d8278daf73b20696ec877d9a3ff584e57391fa69ad10bc64"
          - path: "pack/index.txt"
            provenanceDigest: "f62dc71e1c74a72794db54d3917bc71131cc6eae6f3dcdc3fdada48ff70f93ab"
