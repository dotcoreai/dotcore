# Qwen3.8 Flash Next on Strata, in three quantizations. IQ3_S and IQ2_XS are ISTA-DASLab's GSQ-RCO
# split GGUFs, which Strata packs on first start. NVFP4 is a ready-made Strata pack, re-quantized with
# GPTQ by an individual uploader (Maximilian228), whose repository also holds the pre-built draft
# layer (MTP) every quantization uses; its README says the draft layer is byte-identical to the one
# Strata's setup builds from Qwen's checkpoint. Architecture qwen4exp, 48 layers of 512 experts,
# read from the GGUF headers.
modelId: "qwen3-8-flash-next"
displayName: "Qwen3.8 Flash Next"
version: "3.8-flash-next"
# max_position_embeddings in the Qwen/Qwen3.8-Flash-Next config.json (revision 812d96e), and the
# context length in every GGUF's header.
maximumContextTokens: 262144
artifacts:
  - artifactId: "iq3-s"
    weightQuantization: "IQ3_S"
    source:
      repository: "ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF"
      revision: "ed59f92082b1e93c0e96d60a8b11aab089b52f09"
      snapshot:
        files:
          - path: "IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf"
            provenanceDigest: "4c1eb2ceb4915e1192f4f386021897bde56a97f40a0bb78bb86465e0f7d2aca3"
          - path: "IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf"
            provenanceDigest: "316b46f3a2dbd68c900f43136ab9449f9dcc3725dfd8c794847c204bc161e113"
  - artifactId: "iq2-xs"
    weightQuantization: "IQ2_XS"
    source:
      repository: "ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF"
      revision: "ed59f92082b1e93c0e96d60a8b11aab089b52f09"
      snapshot:
        files:
          - path: "IQ2_XS/Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00001-of-00002.gguf"
            provenanceDigest: "92cee27ae5bbadcd732416a0f7a7f0acc092399dbbe8f5a5efa707c2ec0a49d7"
          # The second shard holds the lookup table, the same file as IQ3_S's.
          - path: "IQ2_XS/Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00002-of-00002.gguf"
            provenanceDigest: "316b46f3a2dbd68c900f43136ab9449f9dcc3725dfd8c794847c204bc161e113"
  - artifactId: "nvfp4"
    weightQuantization: "NVFP4"
    source:
      repository: "Maximilian228/Qwen3.8-Flash-Next-NVFP4-GPTQ-Strata"
