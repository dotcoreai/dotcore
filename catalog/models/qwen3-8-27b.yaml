# Immutable provenance for the public Qwen3.8 27B artifacts.
# The llama.cpp GGUFs embed the MTP head in each main file, so the llama.cpp realization declares an embedded head.
modelId: "qwen3-8-27b"
displayName: "Qwen3.8 27B"
version: "3.8-27b"
# max_position_embeddings in the Qwen/Qwen3.8-27B config.json (revision 1d4bf0f).
maximumContextTokens: 262144
options:
  - optionId: "vision"
    displayName: "Vision"
    vision: {}
  - optionId: "mtp"
    displayName: "MTP"
    speculativeDecoding: { method: "SPECULATIVE_DECODING_METHOD_MTP" }
  - optionId: "kv-cache"
    displayName: "KV cache precision"
    kvCachePrecision: {}
