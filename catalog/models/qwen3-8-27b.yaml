          - path: "chat_template.jinja"
            provenanceDigest: "12827f24b742ea4e80cdc12dbcf9622227056b9f797252a3149263d4f9aaadce"
          - path: "config.json"
            provenanceDigest: "1b3c71868d1299e52df6fc907deb202d5132b1ef0f72aae0ef6d15185dd53a5c"
          - path: "generation_config.json"
            provenanceDigest: "d0d0ed2e37cdfafef4a5067d5ea2407b05f4fb50526e47c008a5b235d50240fb"
          - path: "model.safetensors"
            provenanceDigest: "c473512c70eace07e2256fe9fd76596ac03e3295bee7d54cfb72676416afcc05"
          - path: "model.safetensors.index.json"
            provenanceDigest: "429430e1b9e65b2cb98eff8cd10a06e70a09cee89c48487a3914684aeb6df57f"
          - path: "model_mtp.safetensors"
            provenanceDigest: "1d8268aa85ace093a561e3e7b63b9d390dac1cd55a90cd55b5ec509c3c9da9fe"
