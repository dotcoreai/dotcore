  - artifactId: "q5-xl"
    weightQuantization: "Q5_K_XL"
    source:
      repository: "unsloth/Qwen3.8-27B-GGUF"
      revision: "ce331efc48d5722b4b8041f72793e530eae18d9b"
      file:
        path: "Qwen3.8-27B-UD-Q5_K_XL.gguf"
        provenanceDigest: "a9c4a1d9f7298dfb00c95dd83241530bc07b141ee01ec6962cd31b39d746837c"
  - artifactId: "nvfp4"
    weightQuantization: "NVFP4"
    source:
      repository: "unsloth/Qwen3.8-27B-NVFP4"
      revision: "57926baca9a82b4d6906b43f2750d55315f5b10f"
      snapshot:
