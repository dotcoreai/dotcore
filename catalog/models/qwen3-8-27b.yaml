  # Pre-converted ninfer container holding the weights, MTP head, and vision tower.
  - artifactId: "ninfer-nvfp4"
    weightQuantization: "NVFP4"
    source:
      repository: "neroued/Qwen3.8-27B-nvfp4-NInfer"
      revision: "f0b43ad436b9fa8142c6ed6647c470a6fe409484"
      file:
        path: "qwen3_8_27b_nvfp4.ninfer"
        provenanceDigest: "74d2c57145e6ff11d1d2faa79594477f9bc903a611af1fb20218189fbbb77d82"
auxiliaryArtifacts:
  - auxiliaryArtifactId: "qwen-chat-template"
    source:
      repository: "froggeric/Qwen-Fixed-Chat-Templates"
      revision: "492315ea6d7343bcfb32598d6a898c34e0d69ed8"
      file:
        path: "chat_template.jinja"
        provenanceDigest: "6e1439c913ad7df4a966493ad70de7e7fc5a548d41bbe417c1571f766603629b"
configurations:
  # One llama.cpp configuration for every platform: placement picks the CUDA image on Linux NVIDIA
  # targets and the Metal binary on macOS native targets; both releases share a parameter schema.
  - configurationId: "llama-cpp"
    engineArtifacts:
      - engineReleaseId: "llama-cpp-linux-2026-11-13"
        engineArtifactId: "cuda13"
      - engineReleaseId: "llama-cpp-2026-11-13"
        engineArtifactId: "metal"
    artifactBindings:
      - bindingId: "q3-xl"
        modelArtifactId: "q3-xl"
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
      - bindingId: "q5-xl"
        modelArtifactId: "q5-xl"
    # Sizing shared by every hardware class and binding. Each hardware support entry sets the class
    # parameters once and the binding parameters for every binding. Each constant has exactly one home
    # (shared, class or binding), so shared constants cannot be overridden.
    # MTP terms estimated from the RTX 5090 q3 32k smoke (b11429, count 3, 4 slots), embedded head:
    # mtpBase = main file MTP block 334.75 MiB + draft compute 130.02 MiB + main compute growth 18.47 MiB
    # + 20 MiB margin; per-token = one draft KV layer (4096 B);
    # recurrent = off-mode recurrent state per slot (598.5 MiB measured at 4 slots / 4) per draft token,
    # times the slot count.
    # The main file's MTP block (blk.64, 351,008,768 B) is identical in every tier (GGUF metadata at the
    # pinned revision), so all tiers share the q3 breakdown.
    sizing:
      classParameters: ["promptCacheOnAccelerator", "baseOffsetBytes"]
      bindingParameters: ["baseAccelBytes", "accelBytesPerContextToken", "accelBytesPerContextTokenQ8", "marginBytes"]
      parameters:
        mtpBaseBytes: 527685386
        mtpBytesPerContextToken: 4096
        # Per-slot llama.cpp state: Gated DeltaNet recurrent state, sized from the Qwen/Qwen3.8-27B
        # config.json (revision 1d4bf0f): 48 linear-attention layers x (conv 3 x 10240 + state 48 heads
        # x 128 x 128) f32 values, matching the 598.5 MiB measured at 4 slots / 4. Each MTP draft token
        # keeps one more copy per slot.
        # baseAccelBytes values exclude it: each is the 4-slot measurement minus 4 x slotStateBytes.
        slotStateBytes: 156893184
      estimates:
        # The prompt cache lives in host memory. Where the accelerator allocates from the host pool
        # (promptCacheOnAccelerator 1), it counts in accelerator memory instead and the host memory
        # estimate is unavailable.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + ${baseOffsetBytes}
            + if(${options.kv-cache.precision} == "q8_0", 0, 1) * ${accelBytesPerContextToken} * ${total-context}
            + if(${options.kv-cache.precision} == "q8_0", 1, 0) * ${accelBytesPerContextTokenQ8} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + if(${options.mtp.token-count} > 0, 1, 0)
            * (${mtpBaseBytes} + ${mtpBytesPerContextToken} * ${total-context})
            + ${options.mtp.token-count} * ${parallel-requests} * ${slotStateBytes}
          allowance: >-
            ${promptCacheOnAccelerator} * ${prompt-cache-memory-mib} * MiB
            + ${marginBytes}
        hostMemory:
          unit: bytes
          availableWhen: "${promptCacheOnAccelerator} == 0"
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "nvidia-unified"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "10000000000"
          minimumSystemMemoryBytes: "32000000000"
        # The prompt cache shares the unified pool with the model.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Measured on an NVIDIA GB10 host (linux/arm64): f16 KV with llama.cpp b11429, q8_0 KV with
        # b11723, total contexts 4096-262144. The q8_0 slope is a free-intercept fit: the prompt cache
        # allowance keeps the estimate about 2.1 GB above every measurement, and fitting against the
        # fixed bases would absorb it and under-predict at large contexts.
        # The q4-xl and q5-xl bases add the pinned files' growth over the measured ones (100,229,120 B
        # and 100,024,320 B, all in offloaded layers); a q4-xl launch at the defaults reads within 2 MB.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 12594102259
              accelBytesPerContextToken: 66560
              accelBytesPerContextTokenQ8: 40735
              marginBytes: 41943040
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 16938246127
              accelBytesPerContextToken: 66560
              accelBytesPerContextTokenQ8: 40735
              marginBytes: 37748736
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 19928055788
              accelBytesPerContextToken: 66560
              accelBytesPerContextTokenQ8: 40735
              marginBytes: 37748736
      - hardwareClassId: "nvidia-dedicated"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "10000000000"
          minimumSystemMemoryBytes: "32000000000"
        # The prompt cache stays in host memory, outside the GPU's own memory.
        parameters:
          promptCacheOnAccelerator: 0
          # Derived, not measured: 400 MiB, since the GB10 base terms read 319-374 MiB low on
          # the RTX 5090 smoke runs of the speculative decoding project (b11429).
          baseOffsetBytes: 419430400
        # The binding parameters, q8_0 slope included, are the nvidia-unified (GB10) values verbatim
        # until measured on dedicated memory, so a GB10 remeasurement updates both classes.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 12594102259
              accelBytesPerContextToken: 66560
              accelBytesPerContextTokenQ8: 40735
              marginBytes: 41943040
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 16938246127
              accelBytesPerContextToken: 66560
              accelBytesPerContextTokenQ8: 40735
              marginBytes: 37748736
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 19928055788
              accelBytesPerContextToken: 66560
              accelBytesPerContextTokenQ8: 40735
              marginBytes: 37748736
      - hardwareClassId: "apple"
        # Apple Silicon is always unified memory.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Derived, not measured: the equation of the RTX 5090 before the hardware classes were split,
        # adjusted to the macOS process footprint with the gemma-4-e2b Metal calibration.
        # The q8_0 slope is the nvidia-unified one (40,735) times the same per-token calibration
        # factor as the f16 slope (75,213 / 66,560). The q4-xl and q5-xl bases add the same file growth
        # as the nvidia-unified class.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 15175195123
              accelBytesPerContextToken: 75213
              accelBytesPerContextTokenQ8: 46031
              # The Metal calibration already covers the margin.
              marginBytes: 0
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 19732291674
              accelBytesPerContextToken: 75213
              accelBytesPerContextTokenQ8: 46031
              marginBytes: 0
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 22872152563
              accelBytesPerContextToken: 75213
              accelBytesPerContextTokenQ8: 46031
              marginBytes: 0
    engineConfiguration:
      engineKind: "ENGINE_KIND_LLAMA_CPP"
      llamaCpp:
        fixedSettings:
          gpuLayers: 99
          flashAttention: true
        optionRealizations:
          - optionId: "mtp"
            mtp: { draft: { embedded: {} } }
          - optionId: "kv-cache"
            kvCachePrecision: {}
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
    options:
      # A published Jetson Qwen3.8 MTP example uses 3 draft tokens; Unsloth suggests 2.
      - optionId: "mtp"
        parameters:
          - parameterId: "token-count"
            displayName: "Token count"
            unsignedInteger: { minimum: "0", maximum: "8", unit: "tokens" }
        defaultValues:
          optionId: "mtp"
          values:
            - parameterId: "token-count"
              unsignedInteger: "3"
      - optionId: "kv-cache"
        parameters:
          - parameterId: "precision"
            displayName: "Precision"
            stringEnum: { values: ["f16", "q8_0"] }
        defaultValues:
          optionId: "kv-cache"
          values:
            - parameterId: "precision"
              string: "f16"
  - configurationId: "vllm-nvidia-cuda"
    engineArtifacts:
      - engineReleaseId: "vllm-v0-32-0"
        engineArtifactId: "linux-amd64-cuda"
      - engineReleaseId: "vllm-v0-32-0"
        engineArtifactId: "linux-arm64-cuda"
    artifactBindings:
      - bindingId: "nvfp4"
        modelArtifactId: "nvfp4"
        auxiliaryArtifactIds: ["qwen-chat-template"]
    # Non-KV terms measured on an NVIDIA RTX 5090 (dedicated memory, linux/amd64) with vLLM v0.32.0, at
    # 4 parallel requests and total contexts 16,384-131,072, MTP off and 3 draft tokens, text and vision.
    # The fit uses first starts: vLLM compiles anew for each new context per request and keeps that
    # memory, 1.6-2.1 GB above a start from its compile cache. Vision points include an image request,
    # and some points ran four concurrent long requests. visionBytes keeps the larger NVIDIA GB10
    # measurement; marginBytes covers the largest growth under load seen. First starts on an NVIDIA GB10 host
    # (unified memory, linux/arm64) at total contexts 32,768-131,072 read below these constants.
    sizing:
      parameters:
        modelLoadingBaseBytes: 25917652992
        mtpBytes: 1089765376
        visionBytes: 789212160
        marginBytes: 600000000
        kvBlockBytes: 51380224
        kvBytesPerToken: 32768
        kvMtpBlockBytes: 57376768
        kvMtpBytesPerToken: 34816
      derivedParameters:
        # vLLM holds the total context plus each parallel request's own blocks, in whole blocks: 2
        # recurrent-state blocks per recurrent layer group (3 groups), one more per group for each MTP
        # draft token, and one for rounding the request's context up; one more block is held back. With
        # one request this is vLLM's start check at a context per request equal to the total context.
        # Block bytes are those of the largest MTP draft count; per-token bytes are the larger of vLLM's
        # block layout and the measurement; vision has no KV effect.
        kv-cache-memory-bytes: >-
          if(${options.mtp.token-count} > 0, 1, 0)
          * (${kvMtpBlockBytes} * (1 + ${parallel-requests} * (7 + 3 * ${options.mtp.token-count}))
          + ${kvMtpBytesPerToken} * ${total-context})
          + if(${options.mtp.token-count} == 0, 1, 0)
          * (${kvBlockBytes} * (1 + ${parallel-requests} * 7)
          + ${kvBytesPerToken} * ${total-context})
      estimates:
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${modelLoadingBaseBytes}
            + if(${options.mtp.token-count} > 0, 1, 0) * ${mtpBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
            + ${kv-cache-memory-bytes}
          allowance: >-
            ${marginBytes}
        # Host KV offload size only (rough estimate).
        hostMemory:
          unit: bytes
          equation: >-
            ${kv-offloading-size-gib} * GiB
    hardwareSupport:
      # The minimum covers the largest default profile estimate.
      - hardwareClassId: "nvidia"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "33300000000"
          minimumSystemMemoryBytes: "64000000000"
        bindingSizing:
          - bindingId: "nvfp4"
    engineConfiguration:
      engineKind: "ENGINE_KIND_VLLM"
      vllm:
        fixedSettings:
          reasoningParser: "qwen3"
          toolCallParser: "qwen3_xml"
          chatTemplateAuxiliaryArtifactId: "qwen-chat-template"
          kvCacheDataType: "VLLM_KV_CACHE_DATA_TYPE_FP8"
          kvCacheMemoryBytesParameterId: "kv-cache-memory-bytes"
          maximumBatchedTokensParameterId: "maximum-batched-tokens"
          maximumCudaGraphCaptureSizeParameterId: "maximum-cudagraph-capture-size"
          kvOffloadingSizeGibParameterId: "kv-offloading-size-gib"
          kvOffloadingBackend: "VLLM_KV_OFFLOADING_BACKEND_NATIVE"
          containerPort: 15000
          readinessPolicy:
            mode: "VLLM_READINESS_MODE_MODELS"
          requiresHostIpc: true
          trustRemoteCode: true
          enableLogRequests: true
          enableAutoToolChoice: true
          enableChunkedPrefill: true
          enableAsyncScheduling: true
          enablePrefixCaching: true
          enablePromptTokenDetails: true
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
          - optionId: "mtp"
            mtp: { draft: { embedded: {} } }
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT", "MODEL_INPUT_MODALITY_IMAGE"]
      imageInputCapacity:
        maximumImageCount: 1
        supportedMediaTypes: ["MODEL_IMAGE_MEDIA_TYPE_JPEG", "MODEL_IMAGE_MEDIA_TYPE_PNG"]
        maximumEncodedBytes: "20971520"
        maximumDecodedBytes: "67108864"
        maximumWidth: 8192
        maximumHeight: 8192
        maximumPixels: "16000000"
        fixedVisualTokens: 256
        fixedDetail: "MODEL_IMAGE_DETAIL_AUTO"
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
      - optionId: "mtp"
        parameters:
          - parameterId: "token-count"
            displayName: "Token count"
            unsignedInteger: { minimum: "0", maximum: "8", unit: "tokens" }
        defaultValues:
          optionId: "mtp"
          values:
            - parameterId: "token-count"
              unsignedInteger: "3"
  - configurationId: "ninfer-nvidia-gb202"
    engineArtifacts:
      - engineReleaseId: "ninfer-13ebb92"
        engineArtifactId: "linux-amd64-cuda"
    artifactBindings:
      - bindingId: "ninfer-nvfp4"
        modelArtifactId: "ninfer-nvfp4"
    sizing:
      # Fitted on an RTX 5090 with total-context 32768-232000, parallel-requests 1-4 and every
      # vision and MTP choice; the largest residual is 81 MB. The per-token slopes are the
      # engine's exact pool cost, so the estimate holds past the measured range. marginBytes
      # covers the largest under-prediction plus one text and one draft block of pool rounding.
      parameters:
        baseBytes: 21433928566
        bytesPerContextToken: 33411
        bytesPerConcurrency: 160109070
        visionBytes: 1124254968
        mtpBaseBytes: 864305347
        mtpBytesPerContextToken: 2065
        mtpBytesPerConcurrency: 172209378
        marginBytes: 400000000
      estimates:
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseBytes}
            + ${bytesPerContextToken} * ${total-context}
            + ${bytesPerConcurrency} * ${parallel-requests}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
            + if(${options.mtp.token-count} > 0, 1, 0)
            * (${mtpBaseBytes} + ${mtpBytesPerContextToken} * ${total-context}
            + ${mtpBytesPerConcurrency} * ${parallel-requests})
          allowance: >-
            ${marginBytes}
        # Pinned host context budget (state images, KV and pause snapshots).
        hostMemory:
          unit: bytes
          equation: >-
            ${host-context-mib} * MiB
    hardwareSupport:
      # ninfer is built only for the GB202 chip (sm_120a) of the RTX 5090 and RTX PRO 6000, which
      # its own class matches by device model. The sizing is measured on an RTX 5090; the RTX PRO
      # 6000 shares the chip and is expected to size the same, not yet run on a real card.
      - hardwareClassId: "nvidia-gb202"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "32000000000"
        bindingSizing:
          - bindingId: "ninfer-nvfp4"
    engineConfiguration:
      engineKind: "ENGINE_KIND_NINFER"
      ninfer:
        fixedSettings:
          kvCacheDataType: "NINFER_KV_CACHE_DATA_TYPE_FP8"
          pendingTimeoutMilliseconds: 120000
          preserveThinking: true
          hostContextMibParameterId: "host-context-mib"
          # Device context pool record sizes, read from the engine's startup log at this
          # configuration: one request state (also the pool's block size), and one token of
          # history in the KV cache and in the MTP draft cache.
          stateImageBytes: "153954304"
          kvBytesPerToken: "33024"
          draftKvBytesPerToken: "2064"
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
          - optionId: "mtp"
            mtp:
              optimizedProposalHead: true
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT", "MODEL_INPUT_MODALITY_IMAGE"]
      # ninfer admits media through aggregate source-byte, decoded-pixel, raw-patch, Vision-token,
      # and live-memory budgets rather than an item count, and resizes oversize sources itself, so
      # these bounds cap this node's own validation work. Full-resolution phone stills reach 64
      # megapixels, and the decoded-byte bound stays at four bytes per admitted pixel.
      imageInputCapacity:
        maximumImageCount: 4
        supportedMediaTypes: ["MODEL_IMAGE_MEDIA_TYPE_JPEG", "MODEL_IMAGE_MEDIA_TYPE_PNG"]
        maximumEncodedBytes: "20971520"
        maximumDecodedBytes: "268435456"
        maximumWidth: 16384
        maximumHeight: 16384
        maximumPixels: "67108864"
        fixedVisualTokens: 16384
        fixedDetail: "MODEL_IMAGE_DETAIL_AUTO"
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: true
      # ninfer accepts 1 to 5 MTP draft tokens (docs/startup-configuration.md at 13ebb92); 0 turns it off.
      - optionId: "mtp"
        parameters:
          - parameterId: "token-count"
            displayName: "Token count"
            unsignedInteger: { minimum: "0", maximum: "5", unit: "tokens" }
        defaultValues:
          optionId: "mtp"
          values:
            - parameterId: "token-count"
              unsignedInteger: "3"
profiles:
  - profileId: "q3-xl"
    displayName: "Unsloth Q3_K_XL"
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q3-xl"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
  - profileId: "q4-xl"
    displayName: "Unsloth Q4_K_XL"
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q4-xl"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
  - profileId: "q5-xl"
    displayName: "Unsloth Q5_K_XL"
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q5-xl"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
  - profileId: "nvfp4-text"
    displayName: "Unsloth NVFP4"
    description: "Runs Qwen3.8 27B through vLLM for text inference."
    configurationId: "vllm-nvidia-cuda"
