# Immutable provenance for Qwen3.5 9B's public GGUF tiers.
# Qualification tier: q4-xl on Linux NVIDIA; every tier carries a measured sizing equation.
modelId: "qwen3-5-9b"
displayName: "Qwen3.5 9B"
version: "3.5-9b"
# max_position_embeddings in the Qwen/Qwen3.5-9B config.json (revision c202236).
maximumContextTokens: 262144
options:
  - optionId: "vision"
    displayName: "Vision"
    vision: {}
artifacts:
  - artifactId: "q3-xl"
    weightQuantization: "Q3_K_XL"
    source:
