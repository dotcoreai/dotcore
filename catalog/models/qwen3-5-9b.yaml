      revision: "3885219b6810b007914f3a7950a8d1b469d598a5"
      file:
        path: "Qwen3.5-9B-UD-Q4_K_XL.gguf"
        provenanceDigest: "6f5d30666c2d8ae16a306e616d95341dcf3cc46810df84d7e6f5a7d1e4c1b293"
  - artifactId: "q5-xl"
    weightQuantization: "Q5_K_XL"
    source:
