# Immutable provenance for Qwen3.5 9B's public GGUF tiers and its MLX 4-bit build for oMLX.
# Qualification tiers: q4-xl on Linux NVIDIA, and mlx-4bit on oMLX on an Apple Silicon Mac; every
# tier carries a measured sizing equation.
modelId: "qwen3-5-9b"
displayName: "Qwen3.5 9B"
version: "3.5-9b"
# max_position_embeddings in the Qwen/Qwen3.5-9B config.json (revision c202236).
maximumContextTokens: 262144
options:
  - optionId: "vision"
    displayName: "Vision"
    vision: {}
    visibility: "PARAMETER_VISIBILITY_BASIC"
    description: "Lets requests include images. Loads the vision projector next to the model, which uses more memory."
