auxiliaryArtifacts:
  - auxiliaryArtifactId: "vision-projector"
    source:
      repository: "unsloth/Qwen3.5-9B-GGUF"
      revision: "3885219b6810b007914f3a7950a8d1b469d598a5"
      file:
        path: "mmproj-F16.gguf"
        provenanceDigest: "f70dc3509053962b0d0d3ee8a7eacebf5d60aa560cad78254ae8698516ae029f"
configurations:
  # One llama.cpp configuration for every platform: placement picks the CUDA image on Linux NVIDIA
  # targets and the Metal binary on macOS native targets; both releases share a parameter schema.
  - configurationId: "llama-cpp"
    engineArtifacts:
      - engineReleaseId: "llama-cpp-linux-2026-10-19"
        engineArtifactId: "cuda13"
      - engineReleaseId: "llama-cpp-2026-10-19"
        engineArtifactId: "metal"
    artifactBindings:
      - bindingId: "q3-xl"
        modelArtifactId: "q3-xl"
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
      - bindingId: "q5-xl"
        modelArtifactId: "q5-xl"
    # Sizing shared by every hardware class and binding. Each hardware support entry sets the class
    # parameters once and the binding parameters for every binding. Each constant has exactly one home
    # (shared, class or binding), so shared constants cannot be overridden.
    sizing:
      classParameters: ["promptCacheOnAccelerator", "baseOffsetBytes"]
      bindingParameters: ["baseAccelBytes", "accelBytesPerContextToken", "marginBytes"]
      parameters:
        # Per-slot llama.cpp state: Gated DeltaNet recurrent state, sized from the Qwen/Qwen3.5-9B
        # config.json (revision c202236): 24 linear-attention layers x (conv 3 x 8192 + state 32 heads
        # x 128 x 128) f32 values.
        # baseAccelBytes values exclude it: each is the 4-slot measurement minus 4 x slotStateBytes.
        slotStateBytes: 52690944
        visionBytes: 949682176
      estimates:
        # The prompt cache lives in host memory. Where the accelerator allocates from the host pool
        # (promptCacheOnAccelerator 1), it counts in accelerator memory instead and the host memory
        # estimate is unavailable.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + ${baseOffsetBytes}
            + ${accelBytesPerContextToken} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
          allowance: >-
            ${promptCacheOnAccelerator} * ${prompt-cache-memory-mib} * MiB
            + ${marginBytes}
        hostMemory:
          unit: bytes
          availableWhen: "${promptCacheOnAccelerator} == 0"
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "nvidia-unified"
        # The prompt cache shares the unified pool with the model.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Measured on an NVIDIA GB10 host: unified host pool, linux/arm64, contexts 4096-131072.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 4784504828
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 5696765947
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 6347210746
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
      - hardwareClassId: "nvidia-dedicated"
        # The prompt cache stays in host memory, outside the GPU's own memory.
        parameters:
          promptCacheOnAccelerator: 0
          # Derived, not measured: 400 MiB, since the GB10 base terms read 319-374 MiB low on
          # the RTX 5090 host smoke runs of the speculative decoding project (b11429).
          baseOffsetBytes: 419430400
        # The binding parameters are the nvidia-unified (GB10) values verbatim until measured on
        # dedicated memory, so a GB10 remeasurement updates both classes.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 4784504828
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 5696765947
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 6347210746
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
      - hardwareClassId: "apple"
        # Apple Silicon is always unified memory.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Derived, not measured: the GB10 nvidia-cuda equation adjusted to the macOS process
        # footprint with the gemma-4-e2b Metal calibration.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 6250762411
              accelBytesPerContextToken: 38185
              marginBytes: 136314880
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 7208636587
              accelBytesPerContextToken: 38185
              marginBytes: 136314880
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 8025100459
              accelBytesPerContextToken: 38185
              marginBytes: 136314880
    engineConfiguration:
      engineKind: "ENGINE_KIND_LLAMA_CPP"
      llamaCpp:
        fixedSettings:
          gpuLayers: 99
          flashAttention: true
          jinja: true
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
              auxiliaryArtifactId: "vision-projector"
              imageInputCapacity:
                maximumImageCount: 1
                supportedMediaTypes: ["LLAMA_CPP_IMAGE_MEDIA_TYPE_JPEG", "LLAMA_CPP_IMAGE_MEDIA_TYPE_PNG"]
                maximumEncodedBytes: "20971520"
                maximumDecodedBytes: "67108864"
                maximumWidth: 8192
                maximumHeight: 8192
                maximumPixels: "16000000"
                fixedVisualTokens: 256
                fixedDetail: "LLAMA_CPP_IMAGE_DETAIL_AUTO"
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
