configurations:
  # One llama.cpp configuration for every platform: placement picks the CUDA image on Linux NVIDIA
  # targets and the Metal binary on macOS native targets; both releases share a parameter schema.
  - configurationId: "llama-cpp"
    engineArtifacts:
      - engineReleaseId: "llama-cpp-linux-2026-11-13"
        engineArtifactId: "cuda13"
      - engineReleaseId: "llama-cpp-2026-11-13"
        engineArtifactId: "metal"
    artifactBindings:
      - bindingId: "q3-xl"
        modelArtifactId: "q3-xl"
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
      - bindingId: "q5-xl"
        modelArtifactId: "q5-xl"
    # Sizing shared by every hardware class and binding. Each hardware support entry sets the class
    # parameters once and the binding parameters for every binding. Each constant has exactly one home
    # (shared, class or binding), so shared constants cannot be overridden.
    sizing:
      classParameters: ["promptCacheOnAccelerator", "baseOffsetBytes"]
      bindingParameters: ["baseAccelBytes", "accelBytesPerContextToken", "marginBytes"]
      parameters:
        # Per-slot llama.cpp state: Gated DeltaNet recurrent state, sized from the Qwen/Qwen3.5-9B
        # config.json (revision c202236): 24 linear-attention layers x (conv 3 x 8192 + state 32 heads
        # x 128 x 128) f32 values.
        # baseAccelBytes values exclude it: each is the 4-slot measurement minus 4 x slotStateBytes.
        slotStateBytes: 52690944
        visionBytes: 949682176
      estimates:
        # The prompt cache lives in host memory. Where the accelerator allocates from the host pool
        # (promptCacheOnAccelerator 1), it counts in accelerator memory instead and the host memory
        # estimate is unavailable.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + ${baseOffsetBytes}
            + ${accelBytesPerContextToken} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
          allowance: >-
            ${promptCacheOnAccelerator} * ${prompt-cache-memory-mib} * MiB
            + ${marginBytes}
        hostMemory:
          unit: bytes
          availableWhen: "${promptCacheOnAccelerator} == 0"
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "nvidia-unified"
        # The prompt cache shares the unified pool with the model.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Measured on an NVIDIA GB10 host: unified host pool, linux/arm64, contexts 4096-131072.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 4784504828
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 5696765947
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 6347210746
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
      - hardwareClassId: "nvidia-dedicated"
        # The prompt cache stays in host memory, outside the GPU's own memory.
        parameters:
          promptCacheOnAccelerator: 0
          # Derived, not measured: 400 MiB, since the GB10 base terms read 319-374 MiB low on
          # the RTX 5090 host smoke runs of the speculative decoding project (b11429).
          baseOffsetBytes: 419430400
        # The binding parameters are the nvidia-unified (GB10) values verbatim until measured on
        # dedicated memory, so a GB10 remeasurement updates both classes.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 4784504828
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 5696765947
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 6347210746
              accelBytesPerContextToken: 33792
              marginBytes: 136314880
      - hardwareClassId: "apple"
        # Apple Silicon is always unified memory.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Derived, not measured: the GB10 nvidia-cuda equation adjusted to the macOS process
        # footprint with the gemma-4-e2b Metal calibration.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 6250762411
              accelBytesPerContextToken: 38185
              marginBytes: 136314880
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 7208636587
              accelBytesPerContextToken: 38185
              marginBytes: 136314880
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 8025100459
              accelBytesPerContextToken: 38185
              marginBytes: 136314880
    engineConfiguration:
      engineKind: "ENGINE_KIND_LLAMA_CPP"
      llamaCpp:
        fixedSettings:
          gpuLayers: 99
          flashAttention: true
          jinja: true
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
              auxiliaryArtifactId: "vision-projector"
              imageInputCapacity:
                maximumImageCount: 1
                supportedMediaTypes: ["LLAMA_CPP_IMAGE_MEDIA_TYPE_JPEG", "LLAMA_CPP_IMAGE_MEDIA_TYPE_PNG"]
                maximumEncodedBytes: "20971520"
                maximumDecodedBytes: "67108864"
                maximumWidth: 8192
                maximumHeight: 8192
                maximumPixels: "16000000"
                fixedVisualTokens: 256
                fixedDetail: "LLAMA_CPP_IMAGE_DETAIL_AUTO"
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
  # oMLX on Apple Silicon Macs with macOS 26 or later, text only. oMLX allocates memory as requests
  # arrive, under a whole-process ceiling the adapter derives from this estimate.
  - configurationId: "omlx-apple"
    engineArtifacts:
      - engineReleaseId: "omlx-0-8-4"
        engineArtifactId: "metal"
    artifactBindings:
      - bindingId: "mlx-4bit"
        modelArtifactId: "mlx-4bit"
    sizing:
      bindingParameters: ["baseBytes", "marginBytes"]
      parameters:
        # MLX KV cache in bfloat16, from config.json: 8 full-attention layers x 2 (K and V) x 4 KV
        # heads x 256 dimensions x 2 bytes.
        kvBytesPerToken: 32768
        # Gated DeltaNet recurrent state per request, from config.json: 24 linear-attention layers x
        # (conv 3 x 8192 + state 32 heads x 128 x 128) values, counted at 4 bytes.
        slotStateBytes: 52690944
        # Attention scores of one full prefill chunk at the default 32k context per request: oMLX's
        # 2048-token chunk x 16 attention heads x 4 bytes x 32768 tokens. oMLX prefills one chunk at
        # a time and shrinks chunks of longer contexts to fit its ceiling rather than refusing them.
        prefillBytes: 4294967296
        # oMLX refuses prompts above 95% of its ceiling less the prompt cache, and the adapter sets
        # the ceiling to the estimate / 1.07, so the estimate holds 1.07 / 0.95 of the engine's
        # memory: these add 0.1264 of the per-token and per-request terms, and marginBytes holds
        # that share of the fixed terms.
        guardBytesPerToken: 4140
        guardBytesPerRequest: 6655699
      estimates:
        # What oMLX holds at full load: weights and runtime, the KV cache of every request, their
        # recurrent state and one prefill chunk's attention scores.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseBytes}
            + ${kvBytesPerToken} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + ${prefillBytes}
          # The memory guard's headroom, and 0.07 of the prompt cache for the ceiling's overshoot.
          allowance: >-
            ${marginBytes}
            + ${guardBytesPerToken} * ${total-context}
            + ${parallel-requests} * ${guardBytesPerRequest}
            + ${prompt-cache-memory-mib} * 72 * KiB
        # The in-memory prompt cache, which oMLX keeps out of its prompt admission limit.
        hostMemory:
          unit: bytes
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "apple"
        # The default 4 x 32k context estimates about 20.5 GB.
        hardwareRequirements:
          minimumSystemMemoryBytes: "24000000000"
        # Measured on an M3 Max (36 GiB, macOS 26) at 2 parallel requests x 32k context with a 2 GiB
        # prompt cache: 6.78 GB at start, at most 14.26 GB in two 6-minute runs of near-full prompts,
        # no refusals. oMLX throttled prefill chunks against the host's free memory, so the scores
        # term is derived, not measured unthrottled; 4 parallel requests are extrapolated by the
        # KV and state terms.
        bindingSizing:
          - bindingId: "mlx-4bit"
            parameters:
              # Measured footprint at start: 5.95 GB of weight files plus the MLX runtime.
              baseBytes: 6778246688
              # 512 MiB for allocator slack beyond the equation, plus the guard share of the base,
              # the prefill scores and that slack.
              marginBytes: 2003407952
    engineConfiguration:
      engineKind: "ENGINE_KIND_OMLX"
      omlx:
        fixedSettings:
          promptCacheMibParameterId: "prompt-cache-memory-mib"
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
profiles:
  - profileId: "q3-xl"
    displayName: "Unsloth Q3_K_XL"
    description: "Uses the smaller Q3 weights."
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q3-xl"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
    optionDefaults:
      - optionId: "vision"
        values:
          - parameterId: "enabled"
            boolean: false
  - profileId: "q4-xl"
    displayName: "Unsloth Q4_K_XL"
    description: "Uses the balanced Q4 weights."
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q4-xl"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
    optionDefaults:
      - optionId: "vision"
        values:
          - parameterId: "enabled"
            boolean: false
  - profileId: "q5-xl"
    displayName: "Unsloth Q5_K_XL"
    description: "Uses the higher-precision Q5 weights."
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "q5-xl"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
    optionDefaults:
      - optionId: "vision"
        values:
          - parameterId: "enabled"
            boolean: false
  - profileId: "omlx-4bit"
    displayName: "MLX 4-bit on oMLX"
    description: "Runs the MLX 4-bit weights through oMLX on a Mac with macOS 26 or later, faster than llama.cpp. Text only."
    configurationId: "omlx-apple"
    defaultModelArtifactBindingId: "mlx-4bit"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
    # oMLX's total context is always the parallel requests times the context per request.
    engineParameterVisibilityOverrides:
      - { parameterId: "total-context", visibility: "PARAMETER_VISIBILITY_HIDDEN" }
