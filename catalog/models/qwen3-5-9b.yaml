      revision: "3885219b6810b007914f3a7950a8d1b469d598a5"
      file:
        path: "Qwen3.5-9B-UD-Q3_K_XL.gguf"
        provenanceDigest: "aae0879e1be99ce93f0d56217f8185a399e25ad68a8ebbc095f362706283062f"
  - artifactId: "q4-xl"
    weightQuantization: "Q4_K_XL"
    source:
