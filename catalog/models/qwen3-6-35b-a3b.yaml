    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
      # The Qwen3.6 model card and Unsloth recommend 2 draft tokens.
      - optionId: "mtp"
        parameters:
          - parameterId: "token-count"
