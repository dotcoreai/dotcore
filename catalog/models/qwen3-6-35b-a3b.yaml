configurations:
  # One llama.cpp configuration for every platform: placement picks the CUDA image on Linux NVIDIA
  # targets and the Metal binary on macOS native targets; both releases share a parameter schema.
  - configurationId: "llama-cpp"
    engineArtifacts:
      - engineReleaseId: "llama-cpp-linux-2026-10-19"
        engineArtifactId: "cuda13"
      - engineReleaseId: "llama-cpp-2026-10-19"
        engineArtifactId: "metal"
    artifactBindings:
      - bindingId: "q3-xl"
        modelArtifactId: "q3-xl"
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
      - bindingId: "q5-xl"
        modelArtifactId: "q5-xl"
    # Sizing shared by every hardware class and binding. Each hardware support entry sets the class
    # parameters once and the binding parameters for every binding. Each constant has exactly one home
    # (shared, class or binding), so shared constants cannot be overridden.
    sizing:
      classParameters: ["promptCacheOnAccelerator", "baseOffsetBytes"]
      bindingParameters: ["baseAccelBytes", "accelBytesPerContextToken", "mtpBaseBytes", "marginBytes"]
      parameters:
        mtpBytesPerContextToken: 2048
        # Per-slot llama.cpp state: Gated DeltaNet recurrent state, sized from the Qwen/Qwen3.6-35B-A3B
        # config.json (revision 995ad96): 30 linear-attention layers x (conv 3 x 8192 + state 32 heads
        # x 128 x 128) f32 values. Each MTP draft token keeps one more copy per slot.
        # baseAccelBytes values exclude it: each is the 4-slot measurement minus 4 x slotStateBytes.
        slotStateBytes: 65863680
        visionBytes: 930807808
      estimates:
        # The prompt cache lives in host memory. Where the accelerator allocates from the host pool
        # (promptCacheOnAccelerator 1), it counts in accelerator memory instead and the host memory
        # estimate is unavailable.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + ${baseOffsetBytes}
            + ${accelBytesPerContextToken} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + if(${options.mtp.token-count} > 0, 1, 0)
            * (${mtpBaseBytes} + ${mtpBytesPerContextToken} * ${total-context})
            + ${options.mtp.token-count} * ${parallel-requests} * ${slotStateBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
          allowance: >-
            ${promptCacheOnAccelerator} * ${prompt-cache-memory-mib} * MiB
            + ${marginBytes}
        hostMemory:
          unit: bytes
          availableWhen: "${promptCacheOnAccelerator} == 0"
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "nvidia-unified"
        # The prompt cache shares the unified pool with the model.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        bindingSizing:
          # Measured on an NVIDIA GB10 host: unified host pool, linux/arm64, contexts 4096-131072.
          # Estimated, not remeasured: off-mode base = old measured base + (re-pin file difference +382,057,792 B
          # - MTP block 423,999,488 B, not loaded while MTP is off). MTP terms: mtpBase = block
          # + 180 MiB draft compute and working-buffer growth observed after requests (RTX 5090 smoke),
          # per-token = draft KV (1 layer, 2 KV heads x 256, f16), recurrent = off-mode recurrent state per
          # slot (251.25 MiB measured at 4 slots / 4) per draft token, times the slot count (RTX 5090 smoke, b11429).
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 16571548976
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 612743168
              marginBytes: 134217728
          # Measured on an NVIDIA GB10 host: unified host pool, linux/arm64, contexts 4096-131072.
          # Estimated, not remeasured: off-mode base = old measured base + (re-pin file difference +493,206,848 B
          # - MTP block 528,857,088 B, not loaded while MTP is off). MTP terms: mtpBase = block
          # + 180 MiB draft compute and working-buffer growth observed after requests (RTX 5090 smoke),
          # per-token = draft KV (1 layer, 2 KV heads x 256, f16), recurrent = off-mode recurrent state per
          # slot (251.25 MiB measured at 4 slots / 4) per draft token, times the slot count (RTX 5090 smoke, b11429).
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 22092760362
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 717600768
              marginBytes: 134217728
          # Measured on an NVIDIA GB10 host: unified host pool, linux/arm64, contexts 4096-131072.
          # Estimated, not remeasured: off-mode base = old measured base + (re-pin file difference +566,607,168 B
          # - MTP block 631,617,536 B, not loaded while MTP is off). MTP terms: mtpBase = block
          # + 180 MiB draft compute and working-buffer growth observed after requests (RTX 5090 smoke),
          # per-token = draft KV (1 layer, 2 KV heads x 256, f16), recurrent = off-mode recurrent state per
          # slot (251.25 MiB measured at 4 slots / 4) per draft token, times the slot count (RTX 5090 smoke, b11429).
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 26295452966
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 820361216
              marginBytes: 134217728
      - hardwareClassId: "nvidia-dedicated"
        # The prompt cache stays in host memory, outside the GPU's own memory.
        parameters:
          promptCacheOnAccelerator: 0
          # Derived, not measured: 400 MiB, since the GB10 base terms read 319-374 MiB low on
          # the RTX 5090 smoke runs of the speculative decoding project (b11429).
          baseOffsetBytes: 419430400
        # The binding parameters are the nvidia-unified (GB10) values verbatim until measured on
        # dedicated memory, so a GB10 remeasurement updates both classes.
        bindingSizing:
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 16571548976
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 612743168
              marginBytes: 134217728
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 22092760362
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 717600768
              marginBytes: 134217728
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 26295452966
              accelBytesPerContextToken: 21504
              mtpBaseBytes: 820361216
              marginBytes: 134217728
      - hardwareClassId: "apple"
        # Apple Silicon is always unified memory.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        bindingSizing:
          # Derived, not measured: the GB10 nvidia-cuda equation adjusted to the macOS process
          # footprint with the gemma-4-e2b Metal calibration.
          # Estimated, not remeasured: off-mode base = old measured base + (re-pin file difference +382,057,792 B
          # - MTP block 423,999,488 B, not loaded while MTP is off). MTP terms: mtpBase = block
          # + 180 MiB draft compute and working-buffer growth observed after requests (RTX 5090 smoke),
          # per-token = draft KV (1 layer, 2 KV heads x 256, f16), recurrent = off-mode recurrent state per
          # slot (251.25 MiB measured at 4 slots / 4) per draft token, times the slot count (RTX 5090 smoke, b11429).
          - bindingId: "q3-xl"
            parameters:
              baseAccelBytes: 18570396246
              accelBytesPerContextToken: 24300
              mtpBaseBytes: 612743168
              marginBytes: 134217728
          # Derived, not measured: the GB10 nvidia-cuda equation adjusted to the macOS process
          # footprint with the gemma-4-e2b Metal calibration.
          # Estimated, not remeasured: off-mode base = old measured base + (re-pin file difference +493,206,848 B
          # - MTP block 528,857,088 B, not loaded while MTP is off). MTP terms: mtpBase = block
          # + 180 MiB draft compute and working-buffer growth observed after requests (RTX 5090 smoke),
          # per-token = draft KV (1 layer, 2 KV heads x 256, f16), recurrent = off-mode recurrent state per
          # slot (251.25 MiB measured at 4 slots / 4) per draft token, times the slot count (RTX 5090 smoke, b11429).
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 24367353628
              accelBytesPerContextToken: 24300
              mtpBaseBytes: 717600768
              marginBytes: 134217728
          # Derived, not measured: the GB10 nvidia-cuda equation adjusted to the macOS process
          # footprint with the gemma-4-e2b Metal calibration.
          # Estimated, not remeasured: off-mode base = old measured base + (re-pin file difference +566,607,168 B
          # - MTP block 631,617,536 B, not loaded while MTP is off). MTP terms: mtpBase = block
          # + 180 MiB draft compute and working-buffer growth observed after requests (RTX 5090 smoke),
          # per-token = draft KV (1 layer, 2 KV heads x 256, f16), recurrent = off-mode recurrent state per
          # slot (251.25 MiB measured at 4 slots / 4) per draft token, times the slot count (RTX 5090 smoke, b11429).
          - bindingId: "q5-xl"
            parameters:
              baseAccelBytes: 28781648869
              accelBytesPerContextToken: 24300
              mtpBaseBytes: 820361216
              marginBytes: 134217728
