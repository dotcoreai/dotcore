              unsignedInteger: "2"
  - configurationId: "vllm-nvidia-cuda"
    engineArtifacts:
      - engineReleaseId: "vllm-v0-32-0"
        engineArtifactId: "linux-amd64-cuda"
      - engineReleaseId: "vllm-v0-32-0"
        engineArtifactId: "linux-arm64-cuda"
    artifactBindings:
      - bindingId: "nvfp4"
        modelArtifactId: "nvfp4"
        auxiliaryArtifactIds: ["qwen-chat-template"]
    # Non-KV terms measured with vLLM v0.32.0 on an NVIDIA RTX 5090 host (dedicated memory, linux/amd64)
    # and an NVIDIA GB10 host (unified memory, linux/arm64), at 4 parallel requests and total contexts
    # 16,384-98,304 (RTX 5090) and 16,384-131,072 (GB10), MTP off and 2 draft tokens, text and vision.
    # Every launch was a first start: vLLM compiles anew for each new context per request and keeps that
    # memory. The constants are the RTX 5090 fit, which reads above the GB10 for every term; vision points
    # include an image request. marginBytes covers the largest growth under four concurrent long requests.
    sizing:
      parameters:
        modelLoadingBaseBytes: 27050247319
        mtpBytes: 2450410949
        visionBytes: 591639100
        marginBytes: 800000000
        kvBlockBytes: 21463040
        kvBytesPerToken: 13167
        kvMtpBlockBytes: 25051136
        kvMtpBytesPerToken: 14191
      derivedParameters:
        # vLLM holds the total context plus each parallel request's own blocks, in whole blocks: 2
        # recurrent-state blocks per recurrent layer group (3 groups), one more per group for each MTP
        # draft token, and one for rounding the request's context up; one more block is held back. With
        # one request this is vLLM's start check at a context per request equal to the total context.
        # Block bytes are those of the largest MTP draft count; per-token bytes are the larger of vLLM's
        # block layout and the measurement.
        kv-cache-memory-bytes: >-
          if(${options.mtp.token-count} > 0, 1, 0)
          * (${kvMtpBlockBytes} * (1 + ${parallel-requests} * (7 + 3 * ${options.mtp.token-count}))
          + ${kvMtpBytesPerToken} * ${total-context})
          + if(${options.mtp.token-count} == 0, 1, 0)
          * (${kvBlockBytes} * (1 + ${parallel-requests} * 7)
          + ${kvBytesPerToken} * ${total-context})
      estimates:
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${modelLoadingBaseBytes}
            + if(${options.mtp.token-count} > 0, 1, 0) * ${mtpBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
            + ${kv-cache-memory-bytes}
          allowance: >-
            ${marginBytes}
    hardwareSupport:
      # The minimum covers the largest default profile estimate.
      - hardwareClassId: "nvidia"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "32700000000"
          minimumSystemMemoryBytes: "64000000000"
        bindingSizing:
          - bindingId: "nvfp4"
