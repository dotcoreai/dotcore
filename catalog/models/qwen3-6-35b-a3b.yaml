# Immutable provenance for Qwen3.6 35B A3B's public GGUF tiers.
# Qualification tier: q4-xl on Linux NVIDIA. Base sizing equations are measured for every llama.cpp tier;
# the llama.cpp MTP terms and llama.cpp base terms after the MTP GGUF re-pin are estimates pending
# remeasurement. On Strata, q4-xl is measured on an RTX 5090 and a GB10; q6-xl and q8 run on Strata
# only, with estimated sizing.
# MTP is exposed on vLLM and llama.cpp. The llama.cpp GGUFs come from Unsloth's MTP repository, which embeds the
# MTP head in each main file, so the llama.cpp realization declares an embedded head. The vision projector stays
# pinned to the original repository (identical tensor data). Vision and parallel slots work with MTP on b11429.
