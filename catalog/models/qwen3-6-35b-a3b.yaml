  # Strata reads the GGUF in place and loads the MTP head built into it (no pack, no separate draft
  # layer). It uses the head for draft tokens only when a request's sampling allows it; requests that
  # carry penalties or sampling beyond fully greedy decoding don't draft. It accepts only the UD-Q4_K_XL, UD-Q6_K_XL and Q8_0 files of this repository revision.
  # The experts beyond the expert accelerator memory cap stay in pinned host memory, with every expert
  # pinned there whenever they don't all fit on the GPU.
  # Each Strata engine build carries kernels for its own GPUs only, so each configuration approves
  # one build with the hardware class it runs on.
  # The amd64 build carries kernels for sm_75, sm_86, sm_89 and sm_120 and PTX for compute_120 only,
  # so of the dedicated cards it runs only on those generations; this configuration covers the
  # measured GB202 cards.
  - configurationId: "strata-nvidia-cuda"
    engineArtifacts:
      - engineReleaseId: "strata-0-2-13"
        engineArtifactId: "linux-amd64-cuda"
    artifactBindings:
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
      - bindingId: "q6-xl"
        modelArtifactId: "q6-xl"
      - bindingId: "q8"
        modelArtifactId: "q8"
    sizing:
      classParameters: ["workBytesPerToken"]
      bindingParameters: ["baseAccelBytes", "expertBytes", "expertVramMib", "marginBytes"]
      parameters:
        # Strata's KV layout: 10 attention layers and the MTP block, 2 KV heads x 256, in f32.
        kvBytesPerToken: 45056
      derivedParameters:
        # A fixed cap keeps accelerator memory independent of what is free at start.
        expert-vram-mib: "${expertVramMib}"
      estimates:
        # Whole experts fill the GPU up to the cap.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + if(${expert-vram-mib} * MiB < ${expertBytes}, ${expert-vram-mib} * MiB, ${expertBytes})
            + ${kvBytesPerToken} * ${total-context}
            + ${workBytesPerToken} * ${total-context}
          allowance: >-
            ${marginBytes}
        # Every expert is pinned in host memory when they don't all fit under the cap.
        hostMemory:
          unit: bytes
          equation: >-
            if(${expert-vram-mib} * MiB < ${expertBytes}, ${expertBytes}, 0)
    hardwareSupport:
      - hardwareClassId: "nvidia-gb202"
        # The device minimum fits the default cap and context; the system minimum is upstream's.
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "24000000000"
          minimumSystemMemoryBytes: "32000000000"
        # Measured on an RTX 5090 with q4-xl at one request; 2-4 requests read below the estimate.
        parameters:
          workBytesPerToken: 6129
        bindingSizing:
          # Measured: residuals within 27 MB. expertBytes: the GGUF's routed expert tensors.
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 7934151998
              expertBytes: 20122173440
              expertVramMib: 12288
              marginBytes: 134217728
          # Estimated: q4-xl's constants (same non-expert size) with a larger margin.
          - bindingId: "q6-xl"
            parameters:
              baseAccelBytes: 7934151998
              expertBytes: 29880221696
              expertVramMib: 12288
              marginBytes: 536870912
          # Estimated: q4-xl's constants (same non-expert size) with a larger margin.
          - bindingId: "q8"
            parameters:
              baseAccelBytes: 7934151998
              expertBytes: 35081158656
              expertVramMib: 12288
              marginBytes: 536870912
    engineConfiguration:
      engineKind: "ENGINE_KIND_STRATA"
      strata:
        fixedSettings:
          expertVramMibParameterId: "expert-vram-mib"
          architecture: "qwen35moe"
          mtpDraftTokens: 2
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
  # Strata on the GB10, with the arm64 build.
  - configurationId: "strata-nvidia-gb10"
    engineArtifacts:
      - engineReleaseId: "strata-0-2-13"
        engineArtifactId: "linux-arm64-cuda"
    artifactBindings:
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
      - bindingId: "q6-xl"
        modelArtifactId: "q6-xl"
      - bindingId: "q8"
        modelArtifactId: "q8"
    sizing:
      classParameters: ["workBytesPerToken"]
      bindingParameters: ["baseAccelBytes", "expertBytes", "expertVramMib", "marginBytes"]
      parameters:
        kvBytesPerToken: 45056
      derivedParameters:
        expert-vram-mib: "${expertVramMib}"
      estimates:
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + if(${expert-vram-mib} * MiB < ${expertBytes}, ${expert-vram-mib} * MiB, ${expertBytes})
            + ${kvBytesPerToken} * ${total-context}
            + ${workBytesPerToken} * ${total-context}
          allowance: >-
            ${marginBytes}
        hostMemory:
          unit: bytes
          equation: >-
            if(${expert-vram-mib} * MiB < ${expertBytes}, ${expertBytes}, 0)
    hardwareSupport:
      # The GPU shares the host memory, so each cap holds every expert: a lower cap would also pin
      # them in host memory, using the same memory twice.
      - hardwareClassId: "nvidia-gb10"
        # Measured on a GB10 with q4-xl at one request; 2-4 requests read below the estimate.
        parameters:
          workBytesPerToken: 6181
        bindingSizing:
          # Measured: residuals within 0.5 MB.
          - bindingId: "q4-xl"
            parameters:
              baseAccelBytes: 6213899606
              expertBytes: 20122173440
              expertVramMib: 21504
              marginBytes: 134217728
          # Estimated: q4-xl's constants (same non-expert size) with a larger margin.
          - bindingId: "q6-xl"
            parameters:
              baseAccelBytes: 6213899606
              expertBytes: 29880221696
              expertVramMib: 30720
              marginBytes: 536870912
          # Estimated: q4-xl's constants (same non-expert size) with a larger margin.
          - bindingId: "q8"
            parameters:
              baseAccelBytes: 6213899606
              expertBytes: 35081158656
              expertVramMib: 35840
              marginBytes: 536870912
    engineConfiguration:
      engineKind: "ENGINE_KIND_STRATA"
      strata:
        fixedSettings:
          expertVramMibParameterId: "expert-vram-mib"
          architecture: "qwen35moe"
          mtpDraftTokens: 2
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
