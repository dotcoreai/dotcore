# Immutable provenance for the public Gemma 4 12B QAT GGUF.
modelId: "gemma-4-12b-it-qat"
displayName: "Gemma 4 12B QAT"
version: "4-12b-it-qat"
# max_position_embeddings in the google/gemma-4-12B-it-qat-q4_0-unquantized config.json (revision b6ed862).
maximumContextTokens: 262144
options:
  - optionId: "vision"
    displayName: "Vision"
    vision: {}
  - optionId: "mtp"
    displayName: "MTP"
    speculativeDecoding: { method: "SPECULATIVE_DECODING_METHOD_MTP" }
artifacts:
  - artifactId: "primary"
    weightQuantization: "Q4_K_XL"
    source:
      repository: "unsloth/gemma-4-12B-it-qat-GGUF"
      revision: "980b060c40a8539ac159e0501a3e0f66a6365af3"
      file:
        path: "gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
        provenanceDigest: "90fd44e29e0d7cffeb0fd00dc73cfdab9ed0b0e95306ecf7821ea634c940c370"
auxiliaryArtifacts:
  - auxiliaryArtifactId: "vision-projector"
    source:
      repository: "unsloth/gemma-4-12B-it-qat-GGUF"
      revision: "980b060c40a8539ac159e0501a3e0f66a6365af3"
      file:
        path: "mmproj-F16.gguf"
        provenanceDigest: "ecc4e93128da8363b7dbf2193eab98cf1142353f52ceaa0c95c0872997aaadd3"
  - auxiliaryArtifactId: "mtp-draft"
    source:
      repository: "unsloth/gemma-4-12B-it-qat-GGUF"
      revision: "980b060c40a8539ac159e0501a3e0f66a6365af3"
      file:
        path: "mtp-gemma-4-12B-it.gguf"
        provenanceDigest: "fcb35dea42c71333db904cee11baac525c9ef872818ee3753f6cb156f3c6f4f6"
configurations:
  # One llama.cpp configuration for every platform: placement picks the CUDA image on Linux NVIDIA
  # targets and the Metal binary on macOS native targets; both releases share a parameter schema.
  - configurationId: "llama-cpp"
    engineArtifacts:
      - { engineReleaseId: "llama-cpp-linux-2026-11-13", engineArtifactId: "cuda13" }
      - { engineReleaseId: "llama-cpp-2026-11-13", engineArtifactId: "metal" }
    artifactBindings:
      - bindingId: "primary"
        modelArtifactId: "primary"
    # Sizing shared by every hardware class and binding. Each hardware support entry sets the class
    # parameters once and the binding parameters for every binding. Each constant has exactly one home
    # (shared, class or binding), so shared constants cannot be overridden.
    sizing:
      classParameters: ["promptCacheOnAccelerator", "baseOffsetBytes"]
      bindingParameters: ["baseAccelBytes", "accelBytesPerContextToken", "marginBytes"]
      parameters:
        # Per-slot llama.cpp state: sliding-window KV, sized from the google/gemma-4-12B-it-qat-q4_0-unquantized
        # config.json (revision b6ed862): 1024 cells per slot (sliding_window, unified KV) x 40 sliding
        # layers x 8 KV heads x 256 x f16 K and V.
        # baseAccelBytes values exclude it: each is the 4-slot measurement minus 4 x slotStateBytes.
        slotStateBytes: 335544320
        visionBytes: 359202816
        mtpBaseBytes: 316877355
        mtpBytesPerContextToken: 1028
      estimates:
        # The prompt cache lives in host memory. Where the accelerator allocates from the host pool
        # (promptCacheOnAccelerator 1), it counts in accelerator memory instead and the host memory
        # estimate is unavailable.
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${baseAccelBytes}
            + ${baseOffsetBytes}
            + ${accelBytesPerContextToken} * ${total-context}
            + ${parallel-requests} * ${slotStateBytes}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
            + if(${options.mtp.token-count} > 0, 1, 0)
            * (${mtpBaseBytes} + ${mtpBytesPerContextToken} * ${total-context})
          allowance: >-
            ${promptCacheOnAccelerator} * ${prompt-cache-memory-mib} * MiB
            + ${marginBytes}
        hostMemory:
          unit: bytes
          availableWhen: "${promptCacheOnAccelerator} == 0"
          equation: >-
            ${prompt-cache-memory-mib} * MiB
    hardwareSupport:
      - hardwareClassId: "nvidia-unified"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "10000000000"
          minimumSystemMemoryBytes: "32000000000"
        # The prompt cache shares the unified pool with the model.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Measured on an NVIDIA GB10 host: unified host pool, linux/arm64, contexts 4096-131072.
        bindingSizing:
          - bindingId: "primary"
            parameters:
              baseAccelBytes: 5661197489
              accelBytesPerContextToken: 17725
              marginBytes: 84934656
      - hardwareClassId: "nvidia-dedicated"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "10000000000"
          minimumSystemMemoryBytes: "32000000000"
        # The prompt cache stays in host memory, outside the GPU's own memory.
        parameters:
          promptCacheOnAccelerator: 0
          # Derived, not measured: 400 MiB, since the GB10 base terms read 319-374 MiB low on
          # the RTX 5090 host smoke runs of the speculative decoding project (b11429).
          baseOffsetBytes: 419430400
        # The binding parameters are the nvidia-unified (GB10) values verbatim until measured on
        # dedicated memory, so a GB10 remeasurement updates both classes.
        bindingSizing:
          - bindingId: "primary"
            parameters:
              baseAccelBytes: 5661197489
              accelBytesPerContextToken: 17725
              marginBytes: 84934656
      - hardwareClassId: "apple"
        # Apple Silicon is always unified memory.
        parameters:
          promptCacheOnAccelerator: 1
          baseOffsetBytes: 0
        # Derived, not measured: the GB10 nvidia-cuda equation adjusted to the macOS process
        # footprint with the gemma-4-e2b Metal calibration.
        bindingSizing:
          - bindingId: "primary"
            parameters:
              baseAccelBytes: 7166366227
              accelBytesPerContextToken: 20029
              marginBytes: 84934656
    engineConfiguration:
      engineKind: "ENGINE_KIND_LLAMA_CPP"
      llamaCpp:
        fixedSettings:
          jinja: true
          gpuLayers: 40
          flashAttention: true
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
              auxiliaryArtifactId: "vision-projector"
              imageInputCapacity: { maximumImageCount: 1, supportedMediaTypes: ["LLAMA_CPP_IMAGE_MEDIA_TYPE_JPEG", "LLAMA_CPP_IMAGE_MEDIA_TYPE_PNG"], maximumEncodedBytes: "20971520", maximumDecodedBytes: "67108864", maximumWidth: 8192, maximumHeight: 8192, maximumPixels: "16000000", fixedVisualTokens: 280, fixedDetail: "LLAMA_CPP_IMAGE_DETAIL_AUTO" }
          - optionId: "mtp"
            mtp:
              draft: { auxiliaryArtifactId: "mtp-draft" }
    executionCapabilities: { supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"] }
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT"]
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
      # Unsloth's Gemma 4 guidance recommends 2-4 draft tokens; 3 is its midpoint.
      - optionId: "mtp"
        parameters:
          - parameterId: "token-count"
            displayName: "Token count"
            unsignedInteger: { minimum: "0", maximum: "8", unit: "tokens" }
        defaultValues:
          optionId: "mtp"
          values:
            - parameterId: "token-count"
              unsignedInteger: "3"
profiles:
  - profileId: "gpu"
    displayName: "Unsloth Q4_K_XL"
    description: "Uses GPU acceleration for text and image inference."
    configurationId: "llama-cpp"
    defaultModelArtifactBindingId: "primary"
    engineParameterDefaults:
      values:
        - parameterId: "prompt-cache-memory-mib"
          unsignedInteger: "2048"
    optionDefaults:
      - optionId: "vision"
        values:
          - parameterId: "enabled"
            boolean: true
intelligence:
  overall: 14
license:
  id: Apache-2.0
  termsUrl: https://www.apache.org/licenses/LICENSE-2.0
