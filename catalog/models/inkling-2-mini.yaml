      snapshot:
        files:
          - path: "Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf"
            provenanceDigest: "8a3515374c3cd9b65a1677b17e805bb1e32df8e98756e5f0d2fe1837d62aa4cb"
  # Unsloth Dynamic UD-Q4_K_XL, 17,629,760,736 bytes. Upstream labels its support "basic".
  - artifactId: "q4-xl"
