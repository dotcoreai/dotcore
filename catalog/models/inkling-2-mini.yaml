        provenanceDigest: "53a9035f3255945704b5857657cfb00c1165090c0641c4f782a0cbf268cc16dc"
configurations:
  - configurationId: "vllm-nvidia-cuda-nvfp4"
    # CHECK(https://github.com/vllm-project/vllm/pull/69028): in a stable vLLM release
    #   -> approve the stable vLLM release instead and re-qualify on the RTX 5090 and GB10.
    engineArtifacts:
      - engineReleaseId: "vllm-inkling-2-mini"
        engineArtifactId: "linux-amd64-cuda"
      - engineReleaseId: "vllm-inkling-2-mini"
        engineArtifactId: "linux-arm64-cuda"
    artifactBindings:
      - bindingId: "nvfp4"
        modelArtifactId: "nvfp4"
        auxiliaryArtifactIds: ["inkling-chat-template"]
    # The KV pool follows the pinned engine's block layout; the base, activation, vision and margin constants
    # are measured per hardware class.
    sizing:
      bindingParameters:
        - "modelLoadingBaseBytes"
        - "activationBytesPerBatchedToken"
        - "visionBytes"
        - "visionCeilingBytes"
        - "dsparkBytes"
        - "marginBytes"
      parameters:
        # With FP8 KV: one shared pool of 1 MiB blocks, 96 caches in groups of 8, each with a 128 KiB page.
        kvBlockBytes: 1048576
        # Full attention: 8 fp8 caches x 8 KV heads x 128 x (K + V) bytes per token.
        kvBytesPerToken: 16384
        # Each running request holds the window of the 5 sliding-window groups (1,024 tokens) and the 6 bf16
        # short-convolution groups (one per layer and loop pass), plus one block for rounding its context:
        # 103 blocks, the pinned engine's planner at one token per step.
        kvRequestWindowBytes: 108003328
        # While a prompt is processed, those groups also reserve blocks for twice the batched tokens: about
        # 1.656 blocks per batched token plus 6 blocks beyond the window. Measured on an RTX 5090, prompts are
        # processed one at a time and decoding requests hold only their window, so this is counted once.
        # With the window it is the planner's linear upper bound for one request, which its start check uses.
        kvBatchedTokenBytes: 1736704
        kvPromptReservationBytes: 6291456
        # The DSpark drafter's caches stay bf16 and share the pool: its one full-attention cache adds a
        # quarter block per 64 tokens, and its two sliding-window caches add up to 44 blocks per request
        # (34 at 512 batched tokens, 44 from 2,048 to 4,096). Fitted to the engine's logged capacity at six
        # points on an RTX 5090; the GB10 logs the same capacities.
        kvDsparkBytesPerToken: 4096
        kvDsparkRequestBytes: 46137344
        # With BF16 KV: vLLM's own planner (`get_kv_cache_groups` and
        # `_max_memory_usage_bytes_from_groups`) run on CPU in the pinned image over the checkpoint's layer
        # layout, as for the FP8 constants. Pages double to 256 KiB, so a block is 2 MiB and the short-convolution
        # block shrinks to 16 tokens; the full-attention caches take 8 x 8 KV heads x 128 x (K + V) x 2 bytes per
        # token.
        kvBf16BytesPerToken: 32768
        # The decode window of one request, 103 blocks of 2 MiB: exactly twice the FP8 window.
        kvBf16RequestWindowBytes: 216006656
        # The planner's prompt reservation is exactly linear in the batched tokens at 64 to 4,096 (1.8125 blocks
        # of 2 MiB per batched token, 194 beside them). With the window above and no separate reservation, the
        # equation exceeds the planner by 4 to 12 MiB at every batched token count tried from 1 to 4,096.
        kvBf16BatchedTokenBytes: 1900544
        # The DSpark drafter's three bf16 caches join the target's groups, which makes every group nine caches
        # wide: with BF16 KV the whole pool grows by 9/8 (planner total x 9/8 at 8K and 64K context, 512 and
        # 2,048 batched tokens). That is one eighth of each term above and 4,096 bytes per token as for FP8
        # (`kvDsparkBytesPerToken`). Launched at the largest offered context with 2 requests and 2,048 batched tokens
        # under load: on an RTX 5090 (66,789 tokens with the drafter, 121,694 without) the estimate sat 0.27-0.31 GB
        # above the peak, and on a GB10 (2 x 1,048,576) 0.17 GB with the drafter and 0.57 GB without.
        kvBf16DsparkRequestBytes: 27000832
        kvBf16DsparkBatchedTokenBytes: 237568
      derivedParameters:
        kv-cache-memory-bytes: >-
          if(${options.kv-cache.precision} == "bfloat16", 0, 1)
            * (${parallel-requests} * ${kvRequestWindowBytes}
              + ${kvPromptReservationBytes} + ${kvBatchedTokenBytes} * ${maximum-batched-tokens}
              + ${kvBytesPerToken} * ${total-context})
          + if(${options.kv-cache.precision} == "bfloat16", 1, 0)
            * (${parallel-requests} * ${kvBf16RequestWindowBytes}
              + ${kvBf16BatchedTokenBytes} * ${maximum-batched-tokens}
              + ${kvBf16BytesPerToken} * ${total-context})
          + if(${options.dspark.enabled}, 1, 0)
            * (if(${options.kv-cache.precision} == "bfloat16", 0, 1)
                * (${parallel-requests} * ${kvDsparkRequestBytes} + ${kvDsparkBytesPerToken} * ${total-context})
              + if(${options.kv-cache.precision} == "bfloat16", 1, 0)
                * (${parallel-requests} * ${kvBf16DsparkRequestBytes}
                  + ${kvBf16DsparkBatchedTokenBytes} * ${maximum-batched-tokens}
                  + ${kvDsparkBytesPerToken} * ${total-context}))
      estimates:
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${modelLoadingBaseBytes}
            + if(${options.vision.enabled}
              && ${activationBytesPerBatchedToken} * ${maximum-batched-tokens} + ${visionBytes} >= ${visionCeilingBytes},
              ${visionCeilingBytes},
              ${activationBytesPerBatchedToken} * ${maximum-batched-tokens}
              + if(${options.vision.enabled}, 1, 0) * ${visionBytes})
            + if(${options.dspark.enabled}, 1, 0) * ${dsparkBytes}
            + ${kv-cache-memory-bytes}
          allowance: >-
            ${marginBytes}
        # vLLM pins the KV offloading size in host memory as whole offload chunks, so the setting
        # bounds it.
        hostMemory:
          unit: bytes
          equation: >-
            ${kv-offloading-size-gib} * GiB
    hardwareSupport:
      # The minimum covers the default profile estimate with DSpark off at the default 32K total context, plus
      # the 1% the placement keeps free, so 24 GB GPUs such as the RTX 4090 qualify with a short context and
      # the drafter off. With the drafter on, the same estimate needs about 26.7 GB.
      - hardwareClassId: "nvidia"
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "25500000000"
          minimumSystemMemoryBytes: "64000000000"
        bindingSizing:
          # Text constants fitted on an RTX 5090 from 12 launches on the pre-release engine image at 512-4,096
          # batched tokens, 1-2 requests and 32K-526K total context, and re-checked on the nightly engine
          # release with 11 records (residuals -52 MB to +115 MB). With vision on, memory outside the KV pool
          # grows with the batched tokens by the activations plus `visionBytes` until it reaches
          # `visionCeilingBytes`, where the image encoder's peak governs and the activations fit inside it.
          # Fitted on an RTX 5090 at 512, 1,024, 2,048 and 4,096 batched tokens with two requests of 4 images
          # of 2,048 px at once (vision costs 1.26, 1.28, 1.16 and 0.49 GB): within 37 MB at every point.
          # GB10 launches read below these values. `dsparkBytes` is the drafter's 636 MB of weights plus its graphs and buffers:
          # 889 MB at 512 batched tokens and 929 MB at 2,048 on an RTX 5090 and a GB10 at the same KV pool,
          # sized for 4,096 on that line. The margin covers the largest under-prediction with room for load
          # the launches did not show.
          - bindingId: "nvfp4"
            parameters:
              modelLoadingBaseBytes: 20038563636
              activationBytesPerBatchedToken: 309106
              visionBytes: 1277000000
              visionCeilingBytes: 1788000000
              dsparkBytes: 985000000
              marginBytes: 268435456
    engineConfiguration:
      engineKind: "ENGINE_KIND_VLLM"
      vllm:
        fixedSettings:
          reasoningParser: "inkling"
          toolCallParser: "inkling"
          chatTemplateAuxiliaryArtifactId: "inkling-chat-template"
          kvCacheMemoryBytesParameterId: "kv-cache-memory-bytes"
          maximumBatchedTokensParameterId: "maximum-batched-tokens"
          maximumCudaGraphCaptureSizeParameterId: "maximum-cudagraph-capture-size"
          kvOffloadingSizeGibParameterId: "kv-offloading-size-gib"
          kvOffloadingBackend: "VLLM_KV_OFFLOADING_BACKEND_NATIVE"
          containerPort: 15000
          readinessPolicy:
            mode: "VLLM_READINESS_MODE_MODELS"
          requiresHostIpc: true
          enableLogRequests: true
          enableAutoToolChoice: true
          enableChunkedPrefill: true
          enableAsyncScheduling: true
          enablePrefixCaching: true
          enablePromptTokenDetails: true
        optionRealizations:
          - optionId: "vision"
            vision:
              enabledParameterId: "enabled"
          - optionId: "dspark"
            # The engine accepts only the checkpoint's block size minus one (`mtp_config.block_size` 8,
            # checked in `vllm/models/inkling2/nvidia/dspark.py`).
            dspark: { speculativeTokenCount: 7, drafterPath: "mtp.safetensors" }
          - optionId: "kv-cache"
            kvCachePrecision: {}
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT", "MODEL_INPUT_MODALITY_IMAGE"]
      # The engine has no image-count or size cap and never resizes: an image costs 1 + ceil(h / 40) x
      # ceil(w / 40) tokens (`vllm/models/inkling2/processing.py`). The model card advises 40-4,096 px per
      # side. These limits are a policy within that: the 2,048 px side the engine profiles at startup, with
      # its 2,705 tokens per image, and 32 images per request. Memory does not follow the count: the encoder holds
      # one picture at a time, and each image's tokens count against the context per request. Byte limits are 4
      # bytes per pixel at that size.
      imageInputCapacity:
        maximumImageCount: 32
        supportedMediaTypes: ["MODEL_IMAGE_MEDIA_TYPE_JPEG", "MODEL_IMAGE_MEDIA_TYPE_PNG"]
        maximumEncodedBytes: "16777216"
        maximumDecodedBytes: "16777216"
        maximumWidth: 2048
        maximumHeight: 2048
        maximumPixels: "4194304"
        fixedVisualTokens: 2705
        fixedDetail: "MODEL_IMAGE_DETAIL_AUTO"
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
      # On by default: code decodes 30-80% faster on an RTX 5090 and up to 52% on a GB10, while prose is even
      # on the 5090 and 20% slower on the GB10.
      - optionId: "dspark"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "dspark"
          values:
            - parameterId: "enabled"
              boolean: true
      # FP8 by default, as before the option existed.
      - optionId: "kv-cache"
        parameters:
          - parameterId: "precision"
            displayName: "Precision"
            # The KV dtypes the pinned engine takes for Inkling (`supported` in
            # `vllm/models/inkling2/nvidia/attention.py`): bfloat16 everywhere, fp8 on SM12x GPUs. Its float16 is
            # refused while drafting, which is on by default, so it is not offered.
            stringEnum: { values: ["bfloat16", "fp8"] }
        defaultValues:
          optionId: "kv-cache"
          values:
            - parameterId: "precision"
              string: "fp8"
  - configurationId: "strata-nvidia-cuda"
    # The Inkling engine places its experts itself and takes no expert budgets.
    excludedEngineParameterIds: ["expert-vram-mib", "expert-host-memory-mib"]
    engineArtifacts:
      - engineReleaseId: "strata-0-2-23"
        engineArtifactId: "linux-amd64-cuda"
    artifactBindings:
      - bindingId: "sq-10"
        modelArtifactId: "sq-10"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "sq-15"
        modelArtifactId: "sq-15"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "sq-20"
        modelArtifactId: "sq-20"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "iq3-s"
        modelArtifactId: "iq3-s"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
        auxiliaryArtifactIds: ["strata-tokenizer"]
    # Measured on an RTX 5090: the per-request and chunk terms on strata-0-2-21 (25 runs over the three packs at
    # 1-8 parallel requests and 64K-256K total contexts, each filled with real prompts, plus the runs that
    # failed), and the per-binding weights, the per-token slope, the DFlash 2 drafter and vision on
    # strata-0-2-23 (one request filling the whole context of each binding, at and around the largest fit).
    # Accelerator memory = weights and CUDA state + a chunk buffer at under 4 parallel requests + state per
    # parallel request + per-token KV and growth copy of the total context. The fit is on the peak a start needs:
    # KV grows one layer visit at a time, and each step holds the old visit besides the new one (4,096 bytes per
    # allocated token) and a 256 MiB floor, which samples taken during a run mostly miss. Two SQ-20 runs that ran
    # out of memory growing KV sit on that peak. The catalog's equations are linear in the total context, so
    # terms that follow a request's context are charged on the total: exact at 1 parallel request, high at more.
    sizing:
      bindingParameters: ["weightBytes", "hostPinnedBytes", "marginBytes"]
      parameters:
        # FP16 KV (the wrapper passes --kv fp16): 8 of the 48 layer visits keep full KV, 32 KiB per token.
        kvBytesPerToken: 32768
        # FP8 KV (--kv fp8): the engine's payload is 16 KiB per token (8 visits x 8 KV heads x 128 x (K + V) x
        # 1 byte). Measured on an RTX 5090 (strata-0-2-21) with SQ-20 at 1 parallel request and 383,058 tokens,
        # filled to 371,228 (32.12 GB observed): the whole per-token slope was 21,908 bytes, so this constant holds
        # 22,000 less the shared per-token term below. Only the sum is measured. Runs of SQ-10, SQ-15 and SQ-20 at
        # 2 parallel requests read 16.9-19.8 KB per token on the total context, below the 22,000 because part of
        # the slope follows each request's context and the equation charges it on the total.
        kvFp8BytesPerToken: 17904
        # Sliding-window and convolution state of one request.
        requestStateBytes: 324960316
        # FP8 KV: the 40 sliding-window visits keep 1,024 tokens each, 40,960 token-visits of 4,096 bytes in FP16
        # and 2,112 in FP8 (payload and scales), 81,264,640 bytes less. Derived from the FP16 constant, unmeasured.
        requestStateFp8Bytes: 243695676
        # The engine reads pictures on the GPU on cards of 23.5 GiB or more, holding one picture at a time
        # whatever the image count: the reader's weights (the 0.64 GB vision file) and the buffers of a
        # 1,024-token picture, 1.1 GB (`INKLING_READER_GB` in upstream's `terminal/strata_control/vision_reader.py`;
        # the engine sets that room aside in `ink_cuda_backend.cu`). On an RTX 5090 with SQ-20, a conversation
        # growing to 32 images of 1,024 px after a full-context prompt added 0.67 GB once loaded and 0.94 GB at
        # its peak.
        visionBytes: 1100000000
        # Prefill chunk buffers at 1-3 parallel requests, fitted with 2,048-token chunks; at one request the
        # engine now picks 4,096-token chunks, whose extra memory the weights below hold.
        largeChunkBytes: 1451940443
        # The old layer visit KV growth holds besides the new one, 4,096 bytes per token of the total context:
        # with the FP16 KV slope, 36,864 bytes per token, which every pack and GGUF launch matched.
        requestContextBytesPerToken: 4096
        # The DFlash 2 drafter while the `dflash` option is on, from the GB10's log of one request ("GPU memory
        # taken 1,164 MiB": weights 943 MiB plus scratch 15 MiB) and upstream's reserve in `ink_cuda_backend.cu`
        # (`df2_total_mib`: 112 MiB of other weights, 636 MiB of BF16 block weights on cards of 24 GiB and more,
        # 42 MiB of rings per slot up to 8, 120 MiB of scratch and margin). The base is the 1,164 MiB less one
        # slot's rings, the slot term upstream's. On an RTX 5090 at one request, SQ-20 with the drafter on and off
        # differs by 1.21 GB at the full context (the engine logs 1,054 MiB taken), as this estimates.
        dflashBaseBytes: 1176502272
        dflashSlotBytes: 44040192
      estimates:
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${weightBytes}
            + if(${parallel-requests} < 4, 1, 0) * ${largeChunkBytes}
            + if(${options.kv-cache.precision} == "fp8", 0, 1)
              * (${requestStateBytes} * ${parallel-requests} + ${kvBytesPerToken} * ${total-context})
            + if(${options.kv-cache.precision} == "fp8", 1, 0)
              * (${requestStateFp8Bytes} * ${parallel-requests} + ${kvFp8BytesPerToken} * ${total-context})
            + ${requestContextBytesPerToken} * ${total-context}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
            + if(${options.dflash.enabled}, 1, 0) * (${dflashBaseBytes} + ${dflashSlotBytes} * ${parallel-requests})
          allowance: >-
            ${marginBytes}
        # Only the IQ3_S build keeps a part of its dense weights in pinned host memory.
        hostMemory:
          unit: bytes
          equation: >-
            ${hostPinnedBytes}
    hardwareSupport:
      - hardwareClassId: "nvidia-gb202"
        # The smallest profile at its defaults, sq-10 at one request of 32,768 tokens with DFlash 2 on,
        # estimates 20.17 GB with its allowance; the minimum adds the 1% the placement keeps free.
        hardwareRequirements:
          minimumMemoryBytesPerDevice: "20400000000"
        bindingSizing:
          # weightBytes: the model file plus CUDA context and engine buffers, fitted per binding on strata-0-2-23
          # to the peak of one request filling its whole context (the held memory plus the growth copy).
          # marginBytes: covers the strata-0-2-21 fit's largest under-prediction (299 MB), the 256 MiB growth
          # floor, one growth step and the driver reserve beyond the 1% the capacity check keeps free (179 MB).
          - bindingId: "sq-10"
            parameters:
              weightBytes: 15094130025
              hostPinnedBytes: 0
              marginBytes: 872415232
          - bindingId: "sq-15"
            parameters:
              weightBytes: 18988901737
              hostPinnedBytes: 0
              marginBytes: 872415232
          # sq-20 (the v2 file) takes the larger of its DFlash 2 on and off fits, which differ by 8 MB.
          - bindingId: "sq-20"
            parameters:
              weightBytes: 23971931497
              hostPinnedBytes: 0
              marginBytes: 872415232
          # The GGUFs, fitted the same way. The engine loads a smaller trunk for IQ3_S (1.26 GB on the card) and a
          # larger one for UD-Q4_K_XL (3.29 GB) than for the packs. On one card of compute capability 8.0 or newer
          # the IQ3_S build keeps the 0.93 GB token embedding in pinned host memory (upstream's `inkling_fit.py`),
          # which `hostPinnedBytes` holds; host memory is not measured. The margin is the packs' plus 256 MiB, the
          # reserve upstream adds for non-pack builds on this card (`ink_cuda_backend.cu`).
          - bindingId: "iq3-s"
            parameters:
              weightBytes: 14974723433
              hostPinnedBytes: 930000000
              marginBytes: 1140850688
          - bindingId: "q4-xl"
            parameters:
              weightBytes: 23724893545
              hostPinnedBytes: 0
              marginBytes: 1140850688
    engineConfiguration:
      engineKind: "ENGINE_KIND_STRATA"
      strata:
        fixedSettings:
          inklingEngine: { tokenizerAuxiliaryArtifactId: "strata-tokenizer" }
        optionRealizations:
          - optionId: "vision"
            vision: { enabledParameterId: "enabled", auxiliaryArtifactId: "strata-vision" }
          - optionId: "dflash"
            dflash: { auxiliaryArtifactId: "strata-dflash" }
          - optionId: "kv-cache"
            kvCachePrecision: {}
    executionCapabilities:
      supportedParallelShapes: ["MODEL_PARALLEL_SHAPE_ONE"]
    requestKinds: ["INFERENCE_REQUEST_KIND_CHAT"]
    inputCapabilities:
      supportedModalities: ["MODEL_INPUT_MODALITY_TEXT", "MODEL_INPUT_MODALITY_IMAGE"]
      # A policy for Strata's picture reader, which runs on the GPU from 0.2.23 on cards reporting 23.5 GiB or more
      # (the RTX 5090, the GB10's shared memory) and holds one picture at a time: 32 images per request, each of up
      # to 1,024 px per side, whose tokens count against the context per request. Upstream advises about 442 tokens
      # at this side. The visual token count is the model processor's formula at the cap, 1 + ceil(h / 40) x
      # ceil(w / 40) (`vllm/models/inkling2/processing.py`), an upper bound. Byte limits are 4 bytes per pixel.
      imageInputCapacity:
        maximumImageCount: 32
        supportedMediaTypes: ["MODEL_IMAGE_MEDIA_TYPE_JPEG", "MODEL_IMAGE_MEDIA_TYPE_PNG"]
        maximumEncodedBytes: "4194304"
        maximumDecodedBytes: "4194304"
        maximumWidth: 1024
        maximumHeight: 1024
        maximumPixels: "1048576"
        fixedVisualTokens: 677
        fixedDetail: "MODEL_IMAGE_DETAIL_AUTO"
    options:
      - optionId: "vision"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "vision"
          values:
            - parameterId: "enabled"
              boolean: false
      # On by default, as upstream's engine drafts with it by default.
      - optionId: "dflash"
        parameters:
          - parameterId: "enabled"
            displayName: "Enabled"
            boolean: {}
        defaultValues:
          optionId: "dflash"
          values:
            - parameterId: "enabled"
              boolean: true
      - optionId: "kv-cache"
        parameters:
          - parameterId: "precision"
            displayName: "Precision"
            # The KV types the dotcore Strata adapter launches (`--kv`). The Inkling engine also accepts auto, k8v8
            # and k8v4 (0.2.21), which are not offered.
            stringEnum: { values: ["fp16", "fp8"] }
        defaultValues:
          optionId: "kv-cache"
          values:
            - parameterId: "precision"
              string: "fp16"
  - configurationId: "strata-nvidia-gb10"
    # The Inkling engine places its experts itself and takes no expert budgets.
    excludedEngineParameterIds: ["expert-vram-mib", "expert-host-memory-mib"]
    engineArtifacts:
      - engineReleaseId: "strata-0-2-23"
        engineArtifactId: "linux-arm64-cuda"
    artifactBindings:
      - bindingId: "sq-10"
        modelArtifactId: "sq-10"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "sq-15"
        modelArtifactId: "sq-15"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "sq-20"
        modelArtifactId: "sq-20"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "iq3-s"
        modelArtifactId: "iq3-s"
        auxiliaryArtifactIds: ["strata-tokenizer"]
      - bindingId: "q4-xl"
        modelArtifactId: "q4-xl"
        auxiliaryArtifactIds: ["strata-tokenizer"]
    # Measured on a GB10 (strata-0-2-23; one request filling 250K and 1,040K tokens of a 1,048,576 context for
    # each binding, the drafter on and off, FP8 KV, vision with 32 images, and 3 and 8 parallel requests) and
    # fitted per the model-sizing skill, with the RTX 5090 configuration's equation: weights and CUDA state + a
    # chunk buffer at under 4 parallel requests + state per parallel request + per-token KV and growth copy of
    # the total context. The GB10's samples hold the growth copy: memory stays at its peak after KV stops
    # growing, so the fit is on the sampled peak itself.
    sizing:
      bindingParameters: ["weightBytes", "hostPinnedBytes", "marginBytes"]
      parameters:
        # FP16 KV (the wrapper passes --kv fp16): 32 KiB per token (upstream's memory notes).
        kvBytesPerToken: 32768
        # FP8 KV (--kv fp8): with the per-token term below, the slope of SQ-10 at one request filled to 1,039,668
        # tokens (36.99 GB at the peak), less that term. Below the 16 KiB payload: only the sum is measured.
        kvFp8BytesPerToken: 14625
        # Sliding-window and convolution state of one request, from the engine's logged runner memory at 1, 3
        # and 8 parallel requests (chunks of 4,096, 2,048 and 1,024 tokens), less its starting KV.
        requestStateBytes: 203816960
        # FP8 KV: the FP16 constant less the 81,264,640 bytes the RTX 5090 configuration derives for the
        # sliding-window visits. Derived, unmeasured.
        requestStateFp8Bytes: 122552320
        # The 1,025 MiB the engine holds back for the GPU picture reader (its weights and one 1,024-token
        # picture), which stays loaded once the first picture arrives. A conversation growing to 32 images of
        # 1,024 px added 0.84 GB at its peak.
        visionBytes: 1074790400
        # Prefill chunk buffers of 2,048 tokens over 1,024, from the same logged runner memory. At one request
        # the engine picks 4,096-token chunks, whose extra 1.37 GB the weights below hold.
        largeChunkBytes: 686686208
        # The old layer visit KV growth holds besides the new one, 4,096 bytes per token of the total context.
        requestContextBytesPerToken: 4096
        # The DFlash 2 drafter while the `dflash` option is on: the engine's log of one request on a GB10 reads
        # "GPU memory taken 1,164 MiB" (weights 943 MiB plus scratch 15 MiB), and upstream's reserve adds 42 MiB
        # of rings per further slot, up to 8 (`df2_total_mib` in `ink_cuda_backend.cu`'s headers). The base is the
        # 1,164 MiB less one slot's rings. At 3 and 8 requests the engine logs 1,762 and 2,091 MiB for the
        # drafter and its batched drafting, above this term; the one-request chunk the weights hold covers it.
        dflashBaseBytes: 1176502272
        dflashSlotBytes: 44040192
      estimates:
        acceleratorMemory:
          unit: bytes
          equation: >-
            ${weightBytes}
            + if(${parallel-requests} < 4, 1, 0) * ${largeChunkBytes}
            + if(${options.kv-cache.precision} == "fp8", 0, 1)
              * (${requestStateBytes} * ${parallel-requests} + ${kvBytesPerToken} * ${total-context})
            + if(${options.kv-cache.precision} == "fp8", 1, 0)
              * (${requestStateFp8Bytes} * ${parallel-requests} + ${kvFp8BytesPerToken} * ${total-context})
            + ${requestContextBytesPerToken} * ${total-context}
            + if(${options.vision.enabled}, 1, 0) * ${visionBytes}
            + if(${options.dflash.enabled}, 1, 0) * (${dflashBaseBytes} + ${dflashSlotBytes} * ${parallel-requests})
          allowance: >-
            ${marginBytes}
        # Only the IQ3_S build keeps a part of its dense weights in pinned host memory, which the GB10 shares
        # with the accelerator.
        hostMemory:
          unit: bytes
          equation: >-
            ${hostPinnedBytes}
    hardwareSupport:
      - hardwareClassId: "nvidia-gb10"
        bindingSizing:
          # weightBytes: the model file plus CUDA context and engine buffers, fitted per binding to the peak of one
          # request with the drafter on. sq-10 and sq-20 (the v2 file) filled 1,040,384 tokens; sq-15 and the
          # GGUFs filled 253,952 and add the 0.30 GB sq-10 grew beyond the per-token terms between its two fills.
          # marginBytes: covers prompt loads between the ones measured.
          - bindingId: "sq-10"
            parameters:
              weightBytes: 15481880576
              hostPinnedBytes: 0
              marginBytes: 268435456
          - bindingId: "sq-15"
            parameters:
              weightBytes: 19358728192
              hostPinnedBytes: 0
              marginBytes: 268435456
          - bindingId: "sq-20"
