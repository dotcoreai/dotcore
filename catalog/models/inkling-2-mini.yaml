# Immutable provenance for Thinking Machines' native Inkling-2-Mini checkpoint
# (thinkingmachines/Inkling-2-Mini): the vendor's own ModelOpt build, NVFP4 experts on layers 0-19, MXFP8
# experts on layers 20-23, BF16 attention and routers. It is a 26.4B-total, ~3.5B-active mixture of experts
# whose looped core runs layers 6-17 three times per token, each pass with its own KV cache.
# Only the Inkling vLLM release loads its looped architecture; the stable vLLM release does not.
# The vision tower ships inside the snapshot; vLLM serves images while the `vision` option is on. vLLM loads
# the DSpark drafter (mtp.safetensors) from the model snapshot while the `dspark` option is on.
# Sampling is not pinned: the vendor's temperature 1.0 is a recommendation, set per request.
modelId: "inkling-2-mini"
displayName: "Inkling 2 Mini"
version: "2-mini"
# model_max_length in tokenizer_config.json and max_position_embeddings in config.json (revision 6e7c824).
maximumContextTokens: 1048576
options:
  - optionId: "vision"
    displayName: "Vision"
    vision: {}
    visibility: "PARAMETER_VISIBILITY_BASIC"
    description: "Lets requests include images. Loads the vision projector next to the model, which uses more memory."
  - optionId: "dspark"
    displayName: "DSpark"
    speculativeDecoding: { method: "SPECULATIVE_DECODING_METHOD_DSPARK" }
    visibility: "PARAMETER_VISIBILITY_ADVANCED"
    description: "Drafts a block of tokens ahead and has the model check them together, which makes code generation much faster; prose gains little or slows a bit. Loads the drafter next to the model, which uses more memory and holds less context."
  - optionId: "dflash"
    displayName: "DFlash 2"
    speculativeDecoding: { method: "SPECULATIVE_DECODING_METHOD_DFLASH" }
    visibility: "PARAMETER_VISIBILITY_ADVANCED"
    description: "Drafts a block of tokens ahead with a small separate model and has the model check them together, which makes generation faster. Loads the drafter next to the model, which uses more memory."
  - optionId: "kv-cache"
    displayName: "KV cache precision"
    kvCachePrecision: {}
    visibility: "PARAMETER_VISIBILITY_ADVANCED"
    description: "Precision of the stored request tokens. A lower precision shrinks the memory each token takes, so more context fits, at a small cost in answer quality."
