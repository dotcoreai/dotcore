profiles:
  - profileId: "nvfp4"
    displayName: "Inkling 2 Mini NVFP4"
    description: "Runs Inkling 2 Mini through vLLM for Linux NVIDIA inference."
    configurationIds: ["vllm-nvidia-cuda-nvfp4"]
    defaultModelArtifactBindingId: "nvfp4"
    engineParameterDefaults:
      values:
        # Measured on an RTX 5090: 2,048 processes prompts about twice as fast as 512 and still leaves
        # room for two 256K requests on a 32 GB card.
        - parameterId: "maximum-batched-tokens"
          unsignedInteger: "2048"
        - parameterId: "parallel-requests"
          unsignedInteger: "2"
        - parameterId: "maximum-cudagraph-capture-size"
          unsignedInteger: "32"
        - parameterId: "kv-offloading-size-gib"
          unsignedInteger: "0"
    # The sizing counts batched tokens in its activation, KV and vision terms, fitted at 512-4,096 on an
    # RTX 5090, so operators may trade prompt speed for context.
    engineParameterVisibilityOverrides:
      - { parameterId: "maximum-batched-tokens", visibility: "PARAMETER_VISIBILITY_ADVANCED" }
  - profileId: "strata-sq-10"
    displayName: "SQ-10 on Strata"
    description: "Runs Inkling 2 Mini's SQ-10 pack through Strata."
    configurationIds: ["strata-nvidia-cuda", "strata-nvidia-gb10"]
    defaultModelArtifactBindingId: "sq-10"
    engineParameterDefaults: {}
    # Strata's total context is always the parallel requests times the context per request.
    engineParameterVisibilityOverrides:
      - { parameterId: "total-context", visibility: "PARAMETER_VISIBILITY_HIDDEN" }
  - profileId: "strata-sq-15"
    displayName: "SQ-15 on Strata"
    description: "Runs Inkling 2 Mini's SQ-15 pack through Strata."
    configurationIds: ["strata-nvidia-cuda", "strata-nvidia-gb10"]
    defaultModelArtifactBindingId: "sq-15"
    engineParameterDefaults: {}
    # Strata's total context is always the parallel requests times the context per request.
    engineParameterVisibilityOverrides:
      - { parameterId: "total-context", visibility: "PARAMETER_VISIBILITY_HIDDEN" }
  - profileId: "strata-sq-20"
    displayName: "SQ-20 on Strata"
    description: "Runs Inkling 2 Mini's SQ-20 pack through Strata."
    configurationIds: ["strata-nvidia-cuda", "strata-nvidia-gb10"]
    defaultModelArtifactBindingId: "sq-20"
    engineParameterDefaults: {}
    # Strata's total context is always the parallel requests times the context per request.
    engineParameterVisibilityOverrides:
      - { parameterId: "total-context", visibility: "PARAMETER_VISIBILITY_HIDDEN" }
  # Both GGUF builds support the same options as the packs. Sizing is a first estimate, unmeasured; no
  # recommendation lists them until it is.
  - profileId: "strata-iq3-s"
    displayName: "IQ3_S on Strata"
    description: "Runs Inkling 2 Mini's GSQ-RCO IQ3_S build, a 3.5-bit single file, through Strata."
