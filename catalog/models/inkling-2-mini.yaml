          # The v2 file (19,374,768,128 bytes); the binding keeps its id.
          - path: "Inkling-2-Mini-SQv2-20.strata"
            provenanceDigest: "429671f8eb5b50e593856e6eb82ebb7da9d1f07e99b553438b196f72cc86a6d6"
  # Single-file GGUF builds the Inkling engine reads like a pack; neither repository ships a tokenizer, so
  # they use `strata-tokenizer` too.
