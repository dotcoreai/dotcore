          - path: "Inkling-2-Mini-SQ-15.strata"
            provenanceDigest: "2ea32eed533afba257e2cbee7b073dc2c3da80fe55d1d2d794779b5498e30737"
  - artifactId: "sq-20"
    weightQuantization: "SQ-20"
    source:
      repository: "strata-engine/Inkling-2-Mini-Strata"
      revision: "5623ceb47d7a01db827460ce1c23e7818a75661b"
      snapshot:
