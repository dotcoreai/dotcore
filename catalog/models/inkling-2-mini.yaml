    displayName: "Inkling 2 Mini NVFP4"
    description: "Runs Inkling 2 Mini through vLLM for Linux NVIDIA inference."
    configurationId: "vllm-nvidia-cuda-nvfp4"
    defaultModelArtifactBindingId: "nvfp4"
    engineParameterDefaults:
      values:
        # Measured on an RTX 5090: 2,048 processes prompts about twice as fast as 512 and still leaves
        # room for two 256K requests on a 32 GB card.
        - parameterId: "maximum-batched-tokens"
          unsignedInteger: "2048"
        - parameterId: "parallel-requests"
          unsignedInteger: "2"
        - parameterId: "maximum-cudagraph-capture-size"
          unsignedInteger: "32"
        - parameterId: "kv-offloading-size-gib"
          unsignedInteger: "0"
  - profileId: "nvfp4-multimodal"
