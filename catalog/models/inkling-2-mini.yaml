            provenanceDigest: "53a9035f3255945704b5857657cfb00c1165090c0641c4f782a0cbf268cc16dc"
          - path: "config.json"
            provenanceDigest: "a7a349601f0984c4abf999c480ef775d8567d21f5f84b4e8a3e035b44f288dc2"
          - path: "generation_config.json"
            provenanceDigest: "a08737c07a65a8fdf69f7cf086576210e5aad4b241437090b26d7b0c4f7905f7"
          - path: "hf_quant_config.json"
            provenanceDigest: "7c656207d3ce37879c7be209a036b0dde43bf01f78159bff06880b868ed57143"
          - path: "model-00001-of-00001.safetensors"
            provenanceDigest: "65e60f51aa1284d4fb022584908c315270334d991828bb774af60584523539d1"
          - path: "model.safetensors.index.json"
            provenanceDigest: "c1631065b7b00787993522dddc66a68b3abee869192977fb3dcb796e63bc5838"
          - path: "mtp.safetensors"
            provenanceDigest: "7c3b651317f01f73bcf4e1dceba66ef8b7e1a1eac6bc171e882e690a4b10a1d2"
          - path: "processor_config.json"
            provenanceDigest: "d7350adce18c8be4b607f261c8f0f7eabbf720bb7aaf648a43d4f8372bbacc2d"
          - path: "special_tokens_map.json"
            provenanceDigest: "c16f44b3594563d82743ddb0417a2be1bfe3e2000dfad2da4b8f32554593e1a0"
          - path: "tiktoken/tokenizer.model"
            provenanceDigest: "f170372dd655728909228220d77cf6b8104a59f38a91262a7d2c4027906ec0d8"
          - path: "tokenizer.json"
            provenanceDigest: "7f332727f9a3f093dd452a39cc978e6757627e5dad1b0673aa4e75174f236dd6"
          - path: "tokenizer_config.json"
            provenanceDigest: "bf09342d285139fd37ce10c70878af1d52cb390e9901e10248654293a80ee636"
  # Strata's ready-made packs. Each holds the dense weights and the experts in one file; the drafter is
  # `strata-dflash` and the tokenizer is `strata-tokenizer`. The repository's `SHA256SUMS.txt` is stale for
  # the v2 files, so the digests come from its Hugging Face file listing.
