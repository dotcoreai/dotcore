# Model recommendations for NVIDIA GPUs with their own memory, best first. Minimums per GPU separate
# card sizes: 12, 16 and 24 GB, with the last entry for 8 GB cards. Entries a GPU can't run, such as
# ninfer off an RTX 5090 or RTX PRO 6000, are skipped for it. Coding entries carry the largest
# context per request that starts on an idle card of their size.
